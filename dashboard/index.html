<title>Social OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Hanken+Grotesk:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Layout: a broadcast control room. Hero = 3D engine core + pipeline; then a video wall of live
   platform monitors (bento, all running at once, tap one to bring it forward); then the work desk tabs.
   Deliberately dark-only: it is a lit room of screens. */
:root {
  color-scheme: dark;
  --ink: #06070d; --panel: #0d1020; --panel-2: #131731; --line: rgba(160, 168, 255, 0.13); --line-hot: rgba(170, 160, 255, 0.4);
  --fg: #eef0ff; --muted: #8b91b9; --dim: #5a6088;
  --accent: #a898ff; --accent-ink: #0b0a1c;
  --ig: #ff4f9a; --reel: #ff8a3d; --x: #e9ebf5; --li: #4aa3ff; --fb: #6b84ff; --yt: #ff4343; --th: #c3c5d8; --story: #ffcf5a;
  --ok: #4fe0a0; --warn: #ffbf55; --bad: #ff6b7a;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
body { background: var(--ink); color: var(--fg); font: 15px/1.5 var(--font-body); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink); }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: .5;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(6, 7, 13, .82); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.logo { display: flex; align-items: center; gap: 10px; font: 800 22px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.logo i { width: 14px; height: 14px; border-radius: 4px; background: conic-gradient(var(--ig), var(--reel), var(--story), var(--li), var(--accent), var(--ig)); animation: spin 6s linear infinite; }
nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
nav button { flex: none; border: 0; background: none; color: var(--muted); font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
nav button:hover { color: var(--fg); background: var(--panel); }
nav button[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); }
nav .n { font-size: 10px; background: var(--warn); color: var(--ink); border-radius: 99px; padding: 0 6px; }
.mode { flex: none; display: flex; border: 1px solid var(--line); border-radius: 99px; padding: 2px; }
.mode button { border: 0; background: none; color: var(--muted); font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; padding: 5px 10px; border-radius: 99px; cursor: pointer; }
.mode button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); }
@media (max-width: 720px) { .bar { flex-wrap: wrap; } nav { order: 3; flex-basis: 100%; } .logo { flex: 1; } }

main { padding-block: 22px 64px; display: grid; gap: 26px; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
.hero-copy { display: grid; gap: 18px; align-content: center; min-width: 0; }
.eyebrow { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: ping 1.8s infinite; }
.demo-chip { border: 1px solid var(--warn); color: var(--warn); border-radius: 99px; padding: 1px 8px; }
.hero h1 { margin: 0; font: 900 clamp(54px, 9vw, 116px)/.84 var(--font-display); text-transform: uppercase; letter-spacing: -.005em; text-wrap: balance; }
.hero h1 span { display: block; color: transparent; -webkit-text-stroke: 1.5px var(--accent); }
.hero p { margin: 0; color: var(--muted); max-width: 46ch; font-size: 16px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--panel); padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font: 800 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { font: 400 10px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat.warn b { color: var(--warn); } .stat.bad b { color: var(--bad); }
.core { position: relative; min-height: 360px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  background: radial-gradient(60% 60% at 50% 45%, rgba(168,152,255,.18), transparent 70%), var(--panel); }
.core canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.core .hud { position: absolute; inset: 12px 14px auto; display: flex; justify-content: space-between; font: 400 10px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; pointer-events: none; }
.core .orb { position: absolute; inset: 0; display: grid; place-items: center; }
.core .orb::before { content: ""; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 30%, #3b2c9a 70%); box-shadow: 0 0 80px var(--accent); }
.core .now { position: absolute; left: 14px; right: 14px; bottom: 12px; font: 400 11px/1.5 var(--font-mono); color: var(--fg); pointer-events: none; }
.core .now em { color: var(--accent); font-style: normal; }

/* pipeline */
.pipe { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; position: relative; }
@media (max-width: 640px) { .pipe { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.stage { position: relative; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); overflow: hidden; display: grid; gap: 2px; }
.stage small { font: 400 10px var(--font-mono); color: var(--dim); }
.stage b { font: 800 18px/1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.stage span { font: 400 11px var(--font-mono); color: var(--muted); }
.stage.on { border-color: var(--line-hot); }
.stage.on::after { content: ""; position: absolute; inset: auto 0 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: sweep 1.4s linear infinite; }

/* wall of monitors */
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
h2 { margin: 0; font: 800 30px/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; }
.hint { font: 400 11px var(--font-mono); color: var(--muted); }
.wall { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 168px; gap: 12px; perspective: 1200px; }
.mon { --c: var(--accent); --rx: 0deg; --ry: 0deg; position: relative; min-width: 0; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); overflow: hidden;
  display: grid; grid-template-rows: auto 1fr auto; cursor: pointer; transform: rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .25s ease-out, border-color .2s, box-shadow .2s; }
.mon:hover { border-color: color-mix(in srgb, var(--c) 55%, transparent); box-shadow: 0 18px 50px -20px color-mix(in srgb, var(--c) 60%, transparent); }
.mon::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; background: radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--c) 22%, transparent), transparent 60%); }
.mon.big { grid-column: span 2; grid-row: span 2; } .mon.tall { grid-row: span 2; } .mon.wide { grid-column: span 2; }
@media (max-width: 900px) { .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 150px; } }
@media (max-width: 480px) { .mon.wide { grid-column: span 2; } }
.mon-top { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); position: relative; z-index: 1; min-width: 0; }
.mon-top b { color: var(--fg); font-weight: 500; }
.mon-top .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); flex: none; }
.mon-top .st { margin-left: auto; color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mon.idle .mon-top .dot { background: var(--dim); box-shadow: none; } .mon.idle .mon-top .st { color: var(--dim); }
.mon-body { position: relative; min-height: 0; overflow: hidden; padding: 0 12px; z-index: 1; }
.mon-foot { padding: 8px 12px 10px; position: relative; z-index: 1; display: grid; gap: 6px; }
.prog { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--c); transition: width .6s ease; }
.cap { font: 400 11px/1.4 var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* monitor contents */
.slides { display: flex; gap: 10px; height: 100%; transition: transform .7s cubic-bezier(.7, 0, .2, 1); }
.slide { flex: none; height: calc(100% - 4px); aspect-ratio: 4 / 5; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; color: #14121f; overflow: hidden; }
.slide b { font: 900 clamp(22px, 3vw, 36px)/.9 var(--font-display); text-transform: uppercase; }
.slide small { font: 500 10px var(--font-mono); text-transform: uppercase; opacity: .7; }
.reel { height: 100%; display: grid; grid-template-columns: auto 1fr; gap: 12px; }
.reel-frame { height: 100%; aspect-ratio: 9 / 16; border-radius: 10px; position: relative; overflow: hidden; background: linear-gradient(160deg, #ff8a3d, #b0247a 60%, #2a1250); }
.reel-frame::before { content: ""; position: absolute; inset: -40%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), transparent 40%); animation: drift 6s ease-in-out infinite alternate; }
.reel-frame .word { position: absolute; left: 8px; right: 8px; bottom: 22%; text-align: center; font: 900 20px/1 var(--font-display); text-transform: uppercase; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
.reel-frame .word mark { background: var(--story); color: #14121f; padding: 0 4px; border-radius: 3px; }
.reel-side { display: grid; align-content: end; gap: 8px; min-width: 0; padding-bottom: 6px; }
.track { height: 26px; border-radius: 6px; background: var(--panel-2); position: relative; overflow: hidden; display: flex; gap: 2px; align-items: center; padding: 0 4px; }
.track i { flex: 1; background: color-mix(in srgb, var(--c) 70%, transparent); border-radius: 2px; }
.track.clips i { height: 70%; } .track.clips i:nth-child(odd) { background: color-mix(in srgb, var(--accent) 60%, transparent); }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 8px #fff; left: 0; transition: left .9s linear; }
.lbl { font: 400 10px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.typed { font: 400 13px/1.5 var(--font-body); color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; }
.typed::after { content: "▍"; color: var(--c); animation: blink 1s steps(1) infinite; }
.tweet { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.ava { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, var(--c), var(--accent)); }
.thread-line { border-left: 2px solid var(--line); margin-left: 12px; height: 10px; }
.fb-img { height: 56%; border-radius: 8px; background: linear-gradient(120deg, #2b3a8f, #6b84ff 50%, #b9c6ff); position: relative; overflow: hidden; }
.fb-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: translateX(-100%); animation: shine 2.6s ease-in-out infinite; }
.ab { display: grid; gap: 8px; padding-top: 4px; }
.ab-row { display: grid; gap: 4px; }
.ab-row div { display: flex; justify-content: space-between; gap: 8px; font: 500 12px var(--font-body); }
.ab-row div span { font: 400 11px var(--font-mono); color: var(--muted); flex: none; }
.story { height: 100%; display: grid; grid-template-columns: auto 1fr; gap: 12px; }
.story-frame { height: 100%; aspect-ratio: 9 / 16; border-radius: 10px; position: relative; overflow: hidden; transition: background .6s; padding: 8px 6px; }
.segs { display: flex; gap: 3px; } .segs i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.35); overflow: hidden; } .segs i b { display: block; height: 100%; width: 0; background: #fff; transition: width .9s linear; }
.story-frame strong { position: absolute; left: 8px; right: 8px; top: 40%; font: 900 18px/.95 var(--font-display); text-transform: uppercase; color: #14121f; }
.log { font: 400 11px/1.75 var(--font-mono); color: var(--muted); display: grid; align-content: end; height: 100%; }
.log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: rise .4s ease-out; }
.log em { font-style: normal; color: var(--fg); } .log .p { color: var(--c2, var(--accent)); }
.idle-note { height: 100%; display: grid; place-content: center; text-align: center; gap: 4px; color: var(--dim); font: 400 12px var(--font-mono); }
.idle-note b { font: 800 22px var(--font-display); text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
.live-cap { font: 400 13px/1.5 var(--font-body); color: var(--fg); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }

/* focus overlay */
.scrim { position: fixed; inset: 0; background: rgba(4, 4, 10, .72); backdrop-filter: blur(6px); z-index: 50; }
.mon.focus { position: fixed; z-index: 60; inset: 50% auto auto 50%; width: min(720px, calc(100vw - 32px)); height: min(480px, calc(100vh - 120px)); transform: translate(-50%, -50%) !important; cursor: default; box-shadow: 0 40px 120px -20px color-mix(in srgb, var(--c) 70%, transparent); border-color: color-mix(in srgb, var(--c) 60%, transparent); }
.mon.focus .slide b { font-size: 44px; } .mon.focus .typed { font-size: 16px; }
.close { position: absolute; top: 6px; right: 8px; z-index: 3; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); border-radius: 99px; font: 500 11px var(--font-mono); padding: 4px 10px; cursor: pointer; }

/* desk (work tabs) */
.desk { display: grid; gap: 16px; }
.list { display: grid; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font: 400 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.plat { color: var(--fg); }
.pill { font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; border-radius: 99px; padding: 2px 9px; border: 1px solid currentColor; color: var(--muted); }
.s-waiting, .s-new { color: var(--warn); } .s-approved, .s-posting { color: var(--accent); } .s-posted, .s-active, .s-drafted, .s-done { color: var(--ok); } .s-failed, .s-rejected, .s-dropped { color: var(--bad); }
.caption { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.problems { margin: 0; padding: 10px 12px 10px 28px; border: 1px solid color-mix(in srgb, var(--bad) 50%, transparent); color: var(--bad); border-radius: 10px; font-size: 14px; }
.strip { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
.strip > * { flex: none; scroll-snap-align: start; border-radius: 10px; background: var(--panel-2); object-fit: cover; }
.strip.square > * { width: min(70%, 260px); aspect-ratio: 1; } .strip.story > * { width: min(42%, 150px); aspect-ratio: 9 / 16; }
.preview-media { width: 100%; max-height: 440px; border-radius: 10px; background: #000; object-fit: contain; }
.textpost { border-left: 2px solid var(--accent); padding-left: 12px; }
.btn { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; border-radius: 99px; padding: 9px 16px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--line-hot); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 22px; color: var(--muted); background: var(--panel); }
.day { display: grid; gap: 8px; }
.day h3 { margin: 0; font: 800 20px var(--font-display); text-transform: uppercase; display: flex; gap: 10px; align-items: baseline; }
.day h3 span { font: 400 11px var(--font-mono); color: var(--muted); }
.calpost { display: grid; grid-template-columns: 3px 1fr; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 10px 0; overflow: hidden; }
.calpost .barc { background: currentColor; }
.calpost > div:last-child { min-width: 0; display: grid; gap: 6px; }
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.table { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 400 10px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
textarea, select { font: 15px var(--font-body); color: var(--fg); background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; width: 100%; }
textarea { min-height: 100px; resize: vertical; }
.pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { display: grid; gap: 6px; }
.label { font: 400 10px var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; }
.answer { white-space: pre-wrap; border: 1px solid var(--line-hot); background: var(--panel-2); border-radius: 12px; padding: 12px 14px; overflow-wrap: anywhere; }
.reply { border-left: 2px solid var(--accent); padding-left: 10px; white-space: pre-wrap; }
.banner { border: 1px solid var(--warn); color: var(--warn); border-radius: 12px; padding: 12px 14px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--ink); padding: 10px 16px; border-radius: 99px; font: 500 12px var(--font-mono); max-width: calc(100% - 32px); z-index: 70; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 70%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes drift { to { transform: translate(20%, 25%); } }
@keyframes shine { 60%, 100% { transform: translateX(100%); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<header>
  <div class="wrap bar">
    <div class="logo"><i></i>Social OS</div>
    <nav id="tabs" role="tablist"></nav>
    <div class="mode" id="mode"><button data-mode="live">Live</button><button data-mode="showcase">Showcase</button></div>
  </div>
</header>
<div class="wrap"><main id="view"></main></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
const ALLOWED = {
  draft: ["waiting", "rejected"], waiting: ["approved", "rejected", "draft"],
  approved: ["posting", "waiting", "rejected"], posting: ["posted", "failed"],
  failed: ["approved", "rejected"], posted: [], rejected: ["draft"],
};
const canMove = (from, to) => (ALLOWED[from] || []).includes(to);
const nowIso = () => new Date().toISOString();
const state = { accounts: [], posts: [], messages: [], ideas: [] };
const ui = { loaded: false, offline: false, errors: {}, answer: null, answering: false, focus: null };

const MODELS = {
  haiku:  { model: "claude-haiku-5-5",  modelTier: "quick",   label: "Haiku 5.5" },
  sonnet: { model: "claude-sonnet-5-5", modelTier: "default", label: "Sonnet 5.5" },
  opus:   { model: "claude-opus-5-5",   modelTier: "complex", label: "Opus 5.5" },
};
const EFFORTS = { low: "Low", medium: "Medium", high: "High" };
const PLATFORMS = { instagram: "Instagram", youtube: "YouTube", linkedin: "LinkedIn", x: "X", facebook: "Facebook", threads: "Threads" };
const MANUAL = { x: "https://x.com/compose/post", threads: "https://www.threads.net/" };
const TABS = [["wall", "Control room"], ["approve", "Approve"], ["calendar", "Calendar"], ["accounts", "Accounts"], ["ideas", "Ideas"], ["talk", "Talk"]];
const TZ = "Asia/Kolkata";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let tab = store.get("sos.tab2", "wall");
if (!TABS.some(t => t[0] === tab)) tab = "wall";
let mode = store.get("sos.mode", "");   // "" = decide once data loads

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dayKey = iso => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(iso));
const fmtTime = iso => iso ? new Intl.DateTimeFormat("en-IN", { timeZone: TZ, weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }).format(new Date(iso)) : "No time set";
const fmtHour = iso => new Intl.DateTimeFormat("en-IN", { timeZone: TZ, hour: "numeric", minute: "2-digit" }).format(new Date(iso));
const clock = () => new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit" }).format(new Date());
const accountLabel = id => state.accounts.find(a => a.id === id)?.label || "Unknown account";
const byTime = (a, b) => String(a.plannedAt || "").localeCompare(String(b.plannedAt || ""));
const pill = (cls, text) => `<span class="pill s-${esc(cls)}">${esc(text ?? cls)}</span>`;

let toastTimer;
function showToast(text) {
  const t = $("#toast"); t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3000);
}
function showOffline() { ui.offline = true; if (!mode) mode = "showcase"; render(); }
const ERR_WORDS = { unavailable: "the data service is not answering right now", "invalid-argument": "the page sent something the database refused" };
function showError(name, err) { lastKey = ""; ui.errors[name] = ERR_WORDS[err?.code] || `error "${err?.code || "unknown"}"`; render(); }

/* ---------- data ---------- */
let db = null;
async function connect() {
  db = window.claude ? await claude.use("db") : null;
  if (!db) return showOffline();
  const timer = setTimeout(() => { if (!ui.loaded) showToast("Still loading your data…"); }, 10000);
  let pending = 4;
  for (const name of ["accounts", "posts", "messages", "ideas"]) {
    let first = true;
    db.collection(name).onSnapshot(
      snap => {
        state[name] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (first) { first = false; if (--pending === 0) { ui.loaded = true; clearTimeout(timer); if (!mode) mode = state.posts.length ? "live" : "showcase"; } }
        render(name === "posts" || name === "accounts");
      },
      err => { clearTimeout(timer); showError(name, err); });
  }
}

async function setStatus(post, to) {
  if (!canMove(post.status, to)) return showToast(`Can't move ${post.status} to ${to}`);
  const patch = { status: to, updatedAt: nowIso() };
  if (to === "approved") Object.assign(patch, { approvedBy: "dashboard", approvedAt: nowIso() });
  try { await db.doc(`posts/${post.id}`).update(patch); showToast(to === "approved" ? "Approved" : to === "draft" ? "Sent back to draft" : "Rejected"); }
  catch (e) { showToast(`Couldn't save: ${e.code || "error"}. Try again.`); }
}

async function sendMessage(text) {
  if (!text.trim()) return false;
  await db.collection("messages").add({ from: "user", text, status: "new", reply: null, createdAt: nowIso() });
  return true;
}

async function saveIdea(text, accountId) {
  if (!text.trim()) return false;
  await db.collection("ideas").add({ text, accountId: accountId || null, source: "user", status: "new", createdAt: nowIso() });
  return true;
}

async function quickAnswer(text, modelKey, effort) {
  const sample = window.claude ? await claude.use("sample") : null;
  if (!sample) { showToast("Quick answers are off for this page."); return null; }
  const m = MODELS[modelKey] || MODELS.sonnet;
  const out = await sample([{ role: "user", content:
    "You help a social media creator. Answer briefly and concretely.\n\n" + text }],
    { cache: false, model: m.model, modelTier: m.modelTier, effort });
  return { text: out.text, answeredBy: out.modelApplied ? m.label : "the fallback model" };
}

function laneShell(l) {
  return `<article class="mon ${l.size}" data-lane="${l.id}" style="--c: var(${l.color})" tabindex="0" aria-label="${esc(l.name + " " + l.kind)}">
    <div class="mon-top"><span class="dot"></span><b>${esc(l.name)}</b><span>${esc(l.kind)}</span><span class="st" data-st>…</span></div>
    <div class="mon-body" data-body></div>
    <div class="mon-foot"><div class="prog"><i data-prog></i></div><div class="cap" data-cap></div></div>
  </article>`;
}

function realPostFor(l) {
  const order = { posting: 0, approved: 1, waiting: 2, draft: 3, failed: 4 };
  return state.posts.filter(p => p.platform === l.platform && (!l.fmt || l.fmt.includes(p.format)) && p.status in order)
    .sort((a, b) => order[a.status] - order[b.status] || byTime(a, b))[0] || null;
}
const LIVE_STATE = { posting: ["Posting now", 90], approved: ["Scheduled", 75], waiting: ["Waiting for you", 55], draft: ["Drafting", 30], failed: ["Failed", 100] };

function paintLive(el, l) {
  const body = el.querySelector("[data-body]"), st = el.querySelector("[data-st]"), prog = el.querySelector("[data-prog]"), cap = el.querySelector("[data-cap]");
  if (l.id === "log") { paintLogLive(el); return; }
  const p = realPostFor(l);
  el.classList.toggle("idle", !p);
  if (!p) {
    st.textContent = "Idle"; prog.style.width = "0";
    body.innerHTML = `<div class="idle-note"><b>Idle</b>No ${esc(l.name)} ${esc(l.kind.toLowerCase())} in the queue</div>`;
    cap.textContent = state.accounts.length ? "Claude adds work here" : "Add an account to start this lane"; return;
  }
  const [label, pct] = LIVE_STATE[p.status];
  st.textContent = label; prog.style.width = pct + "%";
  const m = (p.mediaUrls || [])[0];
  body.innerHTML = m && !/\.(mp4|mov|webm)/i.test(m)
    ? `<div class="reel"><img class="reel-frame" src="${esc(m)}" alt="" style="object-fit:cover"><div class="live-cap">${esc(p.title || p.caption)}</div></div>`
    : `<div class="live-cap">${esc(p.title || p.caption)}</div>`;
  cap.textContent = `${accountLabel(p.accountId)} · ${fmtTime(p.plannedAt)}`;
}

function paintLogLive(el) {
  const lines = state.posts.slice().sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0, 6).reverse()
    .map(p => `<div><span class="p">${esc(PLATFORMS[p.platform] || p.platform)}</span> <em>${esc(p.status)}</em> · ${esc((p.title || p.caption || "").slice(0, 60))}</div>`);
  el.querySelector("[data-body]").innerHTML = `<div class="log">${lines.join("") || `<div>No activity yet. Claude's runs show here.</div>`}</div>`;
  el.querySelector("[data-st]").textContent = lines.length ? "Live" : "Idle";
  el.querySelector("[data-prog]").style.width = lines.length ? "100%" : "0";
  el.querySelector("[data-cap]").textContent = `${state.posts.length} posts in the system`;
  el.classList.toggle("idle", !lines.length);
}

// ---- showcase loops ----
const timers = [];
function every(ms, fn) { fn(); if (!REDUCED) timers.push(setInterval(() => { if (!document.hidden) fn(); }, ms)); }
function stopLoops() { while (timers.length) clearInterval(timers.pop()); }
function typer(node, text, speed = 38, done) {
  let i = 0; node.textContent = "";
  if (REDUCED) { node.textContent = text; done && done(); return; }
  const t = setInterval(() => { if (document.hidden) return; i += 1 + (Math.random() < .3 ? 1 : 0); node.textContent = text.slice(0, i); if (i >= text.length) { clearInterval(t); done && done(); } }, speed);
  timers.push(t);
}
const pushLog = (() => { let k = 0; return () => {
  const box = document.querySelector('[data-lane="log"] .log'); if (!box) return;
  const [stage, what] = LOG_LINES[k++ % LOG_LINES.length];
  box.insertAdjacentHTML("beforeend", `<div>${clock()} <span class="p">${stage}</span> <em>${what}</em></div>`);
  while (box.children.length > 7) box.firstElementChild.remove();
  const now = document.querySelector(".core .now"); if (now) now.innerHTML = `<em>${stage}</em> · ${what}`;
  const idx = ["Research", "Strategy", "Create", "Approve", "Publish", "Analyse"].indexOf(stage === "Humanize" || stage === "Preflight" ? "Create" : stage);
  document.querySelectorAll(".stage").forEach((s, i) => s.classList.toggle("on", i === idx));
}; })();

function playShowcase(el, l) {
  const body = el.querySelector("[data-body]"), st = el.querySelector("[data-st]"), prog = el.querySelector("[data-prog]"), cap = el.querySelector("[data-cap]");
  el.classList.remove("idle");
  const D = DEMO[l.id];
  switch (l.id) {
    case "carousel": {
      body.innerHTML = `<div class="slides">${D.slides.map(([bg, h, s]) => `<div class="slide" style="background:${bg}"><small>${esc(s)}</small><b>${esc(h)}</b></div>`).join("")}</div>`;
      let i = 0; const strip = body.querySelector(".slides");
      every(2200, () => { const w = strip.firstElementChild.getBoundingClientRect().width + 10; strip.style.transform = `translateX(${-i * w}px)`;
        st.textContent = `Slide ${i + 1} of ${D.slides.length}`; prog.style.width = ((i + 1) / D.slides.length * 100) + "%"; cap.textContent = "Laying out · brand colours · caption next"; i = (i + 1) % D.slides.length; });
      break;
    }
    case "reel": {
      body.innerHTML = `<div class="reel"><div class="reel-frame"><div class="word"></div></div><div class="reel-side">
        <span class="lbl">Video</span><div class="track clips">${"<i></i>".repeat(9)}<span class="playhead"></span></div>
        <span class="lbl">Audio</span><div class="track wave">${Array.from({ length: 34 }, () => `<i style="height:${20 + Math.random() * 75}%"></i>`).join("")}<span class="playhead"></span></div></div></div>`;
      let t = 0; const word = body.querySelector(".word"), heads = body.querySelectorAll(".playhead");
      every(900, () => { const w = D.words; word.innerHTML = w.slice(Math.max(0, (t % w.length) - 1), (t % w.length) + 1).map((x, j, a) => j === a.length - 1 ? `<mark>${x}</mark>` : x).join(" ");
        const pct = (t % 28) / 28 * 100; heads.forEach(h => h.style.left = pct + "%");
        st.textContent = `Cutting 0:${String(t % 28).padStart(2, "0")} / 0:28`; prog.style.width = pct + "%"; cap.textContent = "Beat-synced captions · hook in first 2 s"; t++; });
      break;
    }
    case "x": case "linkedin": case "threads": case "facebook": {
      const head = l.id === "x" || l.id === "threads"
        ? `<div class="tweet"><span class="ava"></span><div class="typed" data-t></div></div>`
        : l.id === "facebook" ? `<div class="fb-img"></div><div class="typed" data-t style="margin-top:8px"></div>` : `<div class="typed" data-t></div>`;
      body.innerHTML = head;
      const node = body.querySelector("[data-t]");
      const steps = { x: ["Writing thread", "Checking 280 limit", "Ready for approval"], linkedin: ["Writing", "Humanizer pass", "Waiting for your yes"], threads: ["Writing", "Tone check", "Ready to copy"], facebook: ["Writing caption", "Image picked", "Scheduled 7:00 PM"] }[l.id];
      const run = () => { st.textContent = steps[0]; prog.style.width = "20%"; cap.textContent = l.id === "x" ? "Thread · 4 parts" : "Matching the account's voice";
        typer(node, D.text, l.id === "x" ? 30 : 42, () => { st.textContent = steps[1]; prog.style.width = "70%";
          const t2 = setTimeout(() => { st.textContent = steps[2]; prog.style.width = "100%"; const t3 = setTimeout(run, 2600); timers.push(t3); }, 1400); timers.push(t2); }); };
      run();
      break;
    }
    case "youtube": {
      body.innerHTML = `<div class="ab"><div class="ab-row"><div>A · ${esc(D.a)}<span data-a>0%</span></div><div class="prog"><i data-ab="a" style="background:var(--yt)"></i></div></div>
        <div class="ab-row"><div>B · ${esc(D.b)}<span data-b>0%</span></div><div class="prog"><i data-ab="b" style="background:var(--accent)"></i></div></div></div>`;
      every(1500, () => { const a = 40 + Math.round(Math.random() * 25), b = 100 - a;
        body.querySelector('[data-ab="a"]').style.width = a + "%"; body.querySelector('[data-ab="b"]').style.width = b + "%";
        body.querySelector("[data-a]").textContent = a + "%"; body.querySelector("[data-b]").textContent = b + "%";
        st.textContent = "Testing titles"; prog.style.width = "60%"; cap.textContent = "Predicted click share · title + thumbnail"; });
      break;
    }
    case "story": {
      body.innerHTML = `<div class="story"><div class="story-frame"><div class="segs">${D.frames.map(() => "<i><b></b></i>").join("")}</div><strong></strong></div>
        <div class="reel-side"><span class="lbl">Frames</span>${D.frames.map(([, t], i) => `<span class="cap" data-fr="${i}">${i + 1}. ${esc(t)}</span>`).join("")}</div></div>`;
      let i = 0; const fr = body.querySelector(".story-frame"), segs = body.querySelectorAll(".segs b");
      every(1800, () => { const k = i % D.frames.length; if (k === 0) segs.forEach(s => s.style.width = "0");
        segs[k].style.width = "100%"; fr.style.background = D.frames[k][0]; fr.querySelector("strong").textContent = D.frames[k][1];
        body.querySelectorAll("[data-fr]").forEach((n, j) => n.style.color = j === k ? "var(--fg)" : "");
        st.textContent = `Frame ${k + 1} of ${D.frames.length}`; prog.style.width = ((k + 1) / D.frames.length * 100) + "%"; cap.textContent = "One image per frame · preflight OK"; i++; });
      break;
    }
    case "log": {
      body.innerHTML = `<div class="log"></div>`;
      st.textContent = "Running"; prog.style.width = "100%"; cap.textContent = "Every step the engine takes, as it happens";
      for (let n = 0; n < 5; n++) pushLog();
      every(1700, pushLog);
      break;
    }
  }
}

function paintWall(fresh) {
  const wall = $("#wall"); if (!wall) return;
  if (fresh) { stopLoops(); wall.innerHTML = LANES.map(laneShell).join(""); }
  wall.querySelectorAll(".mon").forEach(el => {
    const l = LANES.find(x => x.id === el.dataset.lane);
    if (mode === "showcase") { if (fresh) playShowcase(el, l); } else paintLive(el, l);
  });
}

/* ---------- 3D engine core ---------- */
let core3d = null;
function startCore() {
  const host = document.querySelector(".core"); if (!host) return;
  if (core3d) { host.prepend(core3d.canvas); core3d.resize(); return; }
  if (!window.THREE) { host.insertAdjacentHTML("afterbegin", `<div class="orb"></div>`); return; }
  const THREE = window.THREE;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(42, 1, .1, 100); cam.position.set(0, 0.6, 7.2);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const group = new THREE.Group(); scene.add(group);
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.15, 1), new THREE.MeshBasicMaterial({ color: css("--accent"), wireframe: true, transparent: true, opacity: .55 }));
  const inner = new THREE.Mesh(new THREE.IcosahedronGeometry(.8, 3), new THREE.MeshBasicMaterial({ color: 0x6b54ff, transparent: true, opacity: .35 }));
  const glow = new THREE.Mesh(new THREE.SphereGeometry(.42, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  group.add(core, inner, glow);
  const sats = ["--ig", "--reel", "--x", "--li", "--fb", "--yt", "--th", "--story"].map((n, i, a) => {
    const r = 2.1 + (i % 3) * .45, tilt = (i / a.length) * Math.PI;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, .006, 6, 160), new THREE.MeshBasicMaterial({ color: css(n), transparent: true, opacity: .28 }));
    ring.rotation.set(Math.PI / 2 + Math.sin(tilt) * .7, tilt * .6, 0);
    const sat = new THREE.Mesh(new THREE.SphereGeometry(.09, 16, 16), new THREE.MeshBasicMaterial({ color: css(n) }));
    const trail = new THREE.Mesh(new THREE.SphereGeometry(.2, 16, 16), new THREE.MeshBasicMaterial({ color: css(n), transparent: true, opacity: .18 }));
    ring.add(sat, trail); group.add(ring);
    return { sat, trail, r, speed: .25 + i * .05, phase: i };
  });
  const pts = new Float32Array(600 * 3); for (let i = 0; i < pts.length; i++) pts[i] = (Math.random() - .5) * 16;
  const dust = new THREE.Points(new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(pts, 3)), new THREE.PointsMaterial({ color: 0x9aa0ff, size: .025, transparent: true, opacity: .6 }));
  scene.add(dust);
  let mx = 0, my = 0;
  addEventListener("pointermove", e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
  const canvas = renderer.domElement;
  function resize() { const h = canvas.parentElement; if (!h) return; const w = h.clientWidth, ht = h.clientHeight; renderer.setSize(w, ht, false); cam.aspect = w / ht; cam.updateProjectionMatrix(); }
  addEventListener("resize", resize);
  const t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    group.rotation.y = t * .12 + mx * .6; group.rotation.x = my * .4;
    core.rotation.set(t * .3, t * .4, 0); inner.rotation.set(-t * .2, t * .25, 0);
    glow.scale.setScalar(1 + Math.sin(t * 2.4) * .08);
    for (const s of sats) { const a = t * s.speed + s.phase; s.sat.position.set(Math.cos(a) * s.r, Math.sin(a) * s.r, 0); s.trail.position.copy(s.sat.position); s.trail.scale.setScalar(1 + Math.sin(t * 3 + s.phase) * .3); }
    dust.rotation.y = t * .02;
    renderer.render(scene, cam);
    if (!REDUCED && canvas.isConnected) requestAnimationFrame(frame);
  }
  core3d = { canvas, resize, frame };
  host.prepend(canvas); resize(); requestAnimationFrame(frame);
}

/* ---------- views ---------- */
function stats() {
  if (mode === "showcase") return [["Waiting for you", 3, "warn"], ["Scheduled", 9, ""], ["Posted · 7 days", 21, ""], ["Failed", 0, ""]];
  const weekAgo = Date.now() - 7 * 864e5, c = s => state.posts.filter(p => p.status === s).length;
  return [["Waiting for you", c("waiting"), c("waiting") ? "warn" : ""], ["Scheduled", c("approved"), ""],
    ["Posted · 7 days", state.posts.filter(p => p.status === "posted" && p.postedAt && Date.parse(p.postedAt) >= weekAgo).length, ""], ["Failed", c("failed"), c("failed") ? "bad" : ""]];
}
function pipeCounts() {
  if (mode === "showcase") return ["14 sources", "9 slots", "6 drafts", "3 waiting", "9 queued", "21 posts"];
  const c = (...s) => state.posts.filter(p => s.includes(p.status)).length;
  return ["no-login feeds", `${state.accounts.length} accounts`, `${c("draft")} drafts`, `${c("waiting")} waiting`, `${c("approved", "posting")} queued`, `${c("posted")} posted`];
}

        <h1>Every feed,<span>one engine.</span></h1>
        <p>Claude researches, writes, designs and schedules for every account at once. Nothing goes out until you say yes.</p>
        <div class="stats">${stats().map(([l, v, c]) => `<div class="stat ${c}"><b>${v}</b><span>${l}</span></div>`).join("")}</div>
      </div>
      <div class="core" aria-hidden="true"><div class="hud"><span>Core · 8 channels</span><span>${demo ? "Demo" : "Live"}</span></div><div class="now"><em>${demo ? "Create" : "Standby"}</em> · ${demo ? "carousel slide 3 of 5 laid out" : "waiting for the next job"}</div></div>
    </section>
    <section class="pipe">${["Research", "Strategy", "Create", "Approve", "Publish", "Analyse"].map((s, i) => `<div class="stage ${!demo && i === 3 && state.posts.some(p => p.status === "waiting") ? "on" : ""}"><small>0${i + 1}</small><b>${s}</b><span>${esc(pipeCounts()[i])}</span></div>`).join("")}</section>
    <section class="desk">
      <div class="section-head"><h2>Live wall</h2><span class="hint">${demo ? "Demo loop for showing people · tap a screen to bring it forward" : "Your real queue, one screen per channel · tap a screen to bring it forward"}</span></div>
      <div class="wall" id="wall"></div>
    </section>`;
}

function preview(p) {
  const media = p.mediaUrls || [];
  const isVid = u => /\.(mp4|mov|webm)(\?|$)/i.test(u);
  const one = u => isVid(u) ? `<video src="${esc(u)}" controls playsinline preload="metadata"></video>` : `<img src="${esc(u)}" alt="" loading="lazy">`;
  switch (p.format) {
    case "carousel": return `<div class="strip square">${media.map(one).join("")}</div>`;
    case "story": return `<div class="strip story">${media.map(one).join("")}</div>`;
    case "reel": case "video": case "short":
      return media[0] ? `<video class="preview-media" src="${esc(media[0])}" controls playsinline preload="metadata"></video>` : "";
    case "image": return media[0] ? `<img class="preview-media" src="${esc(media[0])}" alt="">` : "";
    default: return "";
  }
}

function postMeta(p) {
  return `<div class="meta"><span class="plat">${esc(PLATFORMS[p.platform] || p.platform)}</span>
    <span>${esc(accountLabel(p.accountId))}</span><span>${esc(p.format)}</span>
    <span>${esc(fmtTime(p.plannedAt))}</span>${pill(p.status)}</div>`;
}

function viewApprove() {
  const w = state.posts.filter(p => p.status === "waiting").sort(byTime);
  if (!w.length) return `<div class="empty">No drafts waiting. Claude adds them here.</div>`;
  return `<h2>${w.length} waiting for your yes</h2><div class="list">${w.map(p => {
    const probs = p.problems || [];
    const body = ["text", "thread"].includes(p.format) || !(p.mediaUrls || []).length
      ? `<div class="textpost">${p.title ? `<b>${esc(p.title)}</b>` : ""}<p class="caption">${esc(p.caption)}</p></div>`
      : `${preview(p)}${p.title ? `<b>${esc(p.title)}</b>` : ""}<p class="caption">${esc(p.caption)}</p>`;
    return `<article class="card">${postMeta(p)}${body}
      ${probs.length ? `<ul class="problems">${probs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      <div class="row">
        <button class="btn primary" data-act="approved" data-id="${esc(p.id)}" ${probs.length ? "disabled title=\"Fix the problems first\"" : ""}>Approve</button>
        <button class="btn" data-act="draft" data-id="${esc(p.id)}">Back to draft</button>
        <button class="btn danger" data-act="rejected" data-id="${esc(p.id)}">Reject</button>
      </div></article>`;
  }).join("")}</div>`;
}

function viewCalendar() {
  const days = [];
  for (let i = 0; i < 14; i++) days.push(dayKey(new Date(Date.now() + i * 864e5).toISOString()));
  const groups = Object.fromEntries(days.map(d => [d, []]));
  for (const p of state.posts) if (p.plannedAt && groups[dayKey(p.plannedAt)] && p.status !== "rejected") groups[dayKey(p.plannedAt)].push(p);
  const any = days.some(d => groups[d].length);
  const dayName = d => new Intl.DateTimeFormat("en-IN", { timeZone: TZ, weekday: "long", day: "numeric", month: "short" }).format(new Date(d + "T12:00:00+05:30"));
  return `<h2>Next 14 days</h2>
    ${any ? "" : `<div class="empty">No posts planned in the next two weeks.</div>`}
    ${days.filter(d => groups[d].length).map(d => `<section class="day"><h3>${esc(dayName(d))}<span>${groups[d].length} posts</span></h3>
      ${groups[d].sort(byTime).map(p => `<div class="calpost s-${esc(p.status)}"><div class="barc"></div><div>
        <div class="meta"><span>${esc(fmtHour(p.plannedAt))}</span><span class="plat">${esc(PLATFORMS[p.platform] || p.platform)}</span><span>${esc(accountLabel(p.accountId))}</span>${pill(p.status)}</div>
        <div class="clip">${esc(p.title || p.caption)}</div>
        ${MANUAL[p.platform] ? `<div class="row"><button class="btn" data-copy="${esc(p.id)}">Copy text</button><a class="btn" href="${MANUAL[p.platform]}" target="_blank" rel="noopener">Open ${esc(PLATFORMS[p.platform])}</a></div>` : ""}
      </div></div>`).join("")}</section>`).join("")}`;
}

function viewAccounts() {
  if (!state.accounts.length) return `<div class="empty">No accounts yet. Tell Claude in chat: add an account.</div>`;
  return `<h2>Accounts</h2><div class="table"><table><thead><tr><th>Account</th><th>Platform</th><th>Niche</th><th>Posts / week</th><th>Connected</th><th>Status</th></tr></thead><tbody>
    ${state.accounts.map(a => `<tr><td>${esc(a.label)}</td><td>${esc(PLATFORMS[a.platform] || a.platform)}</td><td>${esc(a.niche)}</td><td>${esc(a.postsPerWeek)}</td><td>${a.composioAccountId ? "Yes" : "No"}</td><td>${pill(a.status === "active" ? "active" : "draft", a.status)}</td></tr>`).join("")}
    </tbody></table></div>`;
}

function accountOptions(sel) {
  return `<option value="">Any account</option>` + state.accounts.map(a => `<option value="${esc(a.id)}" ${a.id === sel ? "selected" : ""}>${esc(a.label)} · ${esc(PLATFORMS[a.platform] || a.platform)}</option>`).join("");
}

function viewIdeas() {
  const ideas = [...state.ideas].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  return `<section class="card"><h2>New idea</h2>
      <div class="field"><label class="label" for="idea-text">Idea</label><textarea id="idea-text" placeholder="A post about…"></textarea>
      <span class="muted">Tip: tap the mic on your phone keyboard to speak.</span></div>
      <div class="field"><label class="label" for="idea-acct">For</label><select id="idea-acct">${accountOptions("")}</select></div>
      <div class="row"><button class="btn primary" id="idea-save">Save idea</button></div></section>
    <section class="list"><h2>Ideas</h2>
      ${ideas.length ? ideas.map(i => `<div class="card"><div class="meta"><span>${esc(i.accountId ? accountLabel(i.accountId) : "Any account")}</span><span>${esc(i.source)}</span>${pill(i.status)}</div><p class="caption">${esc(i.text)}</p></div>`).join("")
        : `<div class="empty">No ideas saved yet. Write one above and Claude turns it into a draft.</div>`}
    </section>`;
}

function viewTalk() {
  const mk = store.get("sos.model", "sonnet"), ef = store.get("sos.effort", "medium");
  const msgs = [...state.messages].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  return `<section class="card"><h2>Talk to Claude</h2>
      <div class="field"><label class="label" for="talk-text">Message</label><textarea id="talk-text" placeholder="Ask or tell Claude something…"></textarea>
      <span class="muted">Tip: tap the mic on your phone keyboard to speak.</span></div>
      <div class="pickers">
        <div class="field"><label class="label" for="talk-model">Model</label><select id="talk-model">${Object.entries(MODELS).map(([k, m]) => `<option value="${k}" ${k === mk ? "selected" : ""}>${m.label}</option>`).join("")}</select></div>
        <div class="field"><label class="label" for="talk-effort">Effort</label><select id="talk-effort">${Object.entries(EFFORTS).map(([k, l]) => `<option value="${k}" ${k === ef ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      </div>
      <div class="row"><button class="btn primary" id="talk-send">Send to Claude</button><button class="btn" id="talk-quick" ${ui.answering ? "disabled" : ""}>Quick answer</button></div>
      <span class="muted">Send saves it for Claude to handle in its next run. Quick answer replies now and is not saved.</span>
      ${ui.answering ? `<div class="answer">Thinking…</div>` : ui.answer ? `<div class="answer">${esc(ui.answer.text)}<div class="label" style="margin-top:8px">Answered by ${esc(ui.answer.answeredBy)}</div></div>` : ""}
    </section>
    <section class="list"><h2>Messages</h2>
      ${msgs.length ? msgs.map(m => `<div class="card"><div class="meta"><span>${m.from === "claude" ? "Claude" : "You"}</span><span>${esc(fmtTime(m.createdAt))}</span>${pill(m.status === "done" ? "done" : "new", m.status === "done" ? "answered" : "new")}</div>
        <p class="caption">${esc(m.text)}</p>${m.reply ? `<div class="reply">${esc(m.reply)}</div>` : ""}</div>`).join("")
        : `<div class="empty">No messages yet. Claude answers saved messages here.</div>`}
    </section>`;
}

const VIEWS = { wall: viewWall, approve: viewApprove, calendar: viewCalendar, accounts: viewAccounts, ideas: viewIdeas, talk: viewTalk };

let lastKey = "";
function render(dataChanged) {
  const waiting = state.posts.filter(p => p.status === "waiting").length;
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${l}${k === "approve" && waiting ? `<span class="n">${waiting}</span>` : ""}</button>`).join("");
  document.querySelectorAll("#mode button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === (mode || "showcase"))));
  // the wall keeps running between data updates; only rebuild it when the tab or mode changes
  const key = tab + "|" + mode;
  if (tab === "wall" && key === lastKey) { if (dataChanged && mode === "live") { refreshHero(); paintWall(false); } return; }
  lastKey = key;
  const keep = ["idea-text", "talk-text", "idea-acct"].map(id => [id, document.getElementById(id)?.value]);
  const focused = document.activeElement?.id;
  let html = "";
  if (ui.offline) html += `<div class="banner">Open this page signed in to claude.ai to see your data. The control room is showing demo content.</div>`;
  for (const [name, why] of Object.entries(ui.errors)) html += `<div class="banner">Couldn't load ${esc(name)}: ${esc(why)}. Reopen the page to retry.</div>`;
  closeFocus(true);
  $("#view").innerHTML = html + VIEWS[tab]();
  for (const [id, v] of keep) { const el = document.getElementById(id); if (el && v != null) el.value = v; }
  if (focused) document.getElementById(focused)?.focus();
  if (tab === "wall") { stopLoops(); paintWall(true); startCore(); } else stopLoops();
}
function refreshHero() {
  const s = document.querySelector(".stats"); if (s) s.innerHTML = stats().map(([l, v, c]) => `<div class="stat ${c}"><b>${v}</b><span>${l}</span></div>`).join("");
  document.querySelectorAll(".stage span").forEach((n, i) => n.textContent = pipeCounts()[i]);
}

/* ---------- focus a monitor ---------- */
function openFocus(el) {
  if (ui.focus) return;
  const ph = document.createElement("div"); ph.className = el.className; ph.style.visibility = "hidden"; el.replaceWith(ph);
  const scrim = document.createElement("div"); scrim.className = "scrim"; scrim.dataset.scrim = "1";
  document.body.append(scrim, el); el.classList.add("focus");
  el.insertAdjacentHTML("afterbegin", `<button class="close" data-close>Close</button>`);
  ui.focus = { el, ph, scrim };
}
function closeFocus(silent) {
  if (!ui.focus) return;
  const { el, ph, scrim } = ui.focus; ui.focus = null;
  el.querySelector("[data-close]")?.remove(); el.classList.remove("focus"); scrim.remove();
  if (ph.isConnected && !silent) ph.replaceWith(el); else { ph.remove(); el.remove(); }
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  if (e.target.closest("[data-close]") || e.target.dataset.scrim) return closeFocus();
  const mon = e.target.closest(".mon");
  if (mon && !mon.classList.contains("focus")) return openFocus(mon);
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; store.set("sos.tab2", tab); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.mode) { mode = t.dataset.mode; store.set("sos.mode", mode); render(); return; }
  if (!db && (t.dataset.act || t.id === "idea-save" || t.id === "talk-send")) return showToast("Sign in to claude.ai to save.");
  if (t.dataset.act) { const p = state.posts.find(x => x.id === t.dataset.id); if (p) { t.disabled = true; await setStatus(p, t.dataset.act); } return; }
  if (t.dataset.copy) {
    const p = state.posts.find(x => x.id === t.dataset.copy); if (!p) return;
    try { await navigator.clipboard.writeText(p.caption); showToast("Copied. Paste it in the app."); }
    catch { showToast("Copy was blocked. Press and hold the text to copy it."); }
    return;
  }
  if (t.id === "idea-save") {
    try { if (await saveIdea($("#idea-text").value, $("#idea-acct").value)) { $("#idea-text").value = ""; showToast("Idea saved"); } else showToast("Write the idea first."); }
    catch (err) { showToast(`Couldn't save: ${err.code || "error"}.`); }
    return;
  }
  if (t.id === "talk-send") {
    try { if (await sendMessage($("#talk-text").value)) { $("#talk-text").value = ""; showToast("Sent. Claude answers here."); } else showToast("Write a message first."); }
    catch (err) { showToast(`Couldn't send: ${err.code || "error"}.`); }
    return;
  }
  if (t.id === "talk-quick") {
    const text = $("#talk-text").value; if (!text.trim()) return showToast("Write a question first.");
    ui.answering = true; ui.answer = null; lastKey = ""; render();
    try { ui.answer = await quickAnswer(text, $("#talk-model").value, $("#talk-effort").value); }
    catch (err) { ui.answer = { text: err.code === "rate_limited" ? "Too many quick answers just now. Wait a minute." : err.code === "not_granted" ? "Quick answers are switched off for this page." : (err.text || "That didn't work. Try again."), answeredBy: "nobody" }; }
    ui.answering = false; lastKey = ""; render();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeFocus();
  if (e.key === "Enter" && e.target.classList?.contains("mon") && !e.target.classList.contains("focus")) openFocus(e.target);
});
document.addEventListener("change", e => {
  if (e.target.id === "talk-model") store.set("sos.model", e.target.value);
  if (e.target.id === "talk-effort") store.set("sos.effort", e.target.value);
});
// hover tilt on monitors
document.addEventListener("pointermove", e => {
  if (REDUCED) return;
  const m = e.target.closest?.(".mon:not(.focus)");
  document.querySelectorAll(".mon.tilted").forEach(x => { if (x !== m) { x.classList.remove("tilted"); x.style.setProperty("--rx", "0deg"); x.style.setProperty("--ry", "0deg"); } });
  if (!m) return;
  const r = m.getBoundingClientRect(), px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
  m.classList.add("tilted"); m.style.setProperty("--rx", (-py * 6) + "deg"); m.style.setProperty("--ry", (px * 8) + "deg");
});

render();
connect();
</script>
