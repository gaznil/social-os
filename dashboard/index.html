<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&family=Noto+Sans+Malayalam:wght@400;500&display=swap">
<style>
/* ElevenLabs App x BlueYard studio architecture: expandable/closable 236px #FAFAFA sidebar + full-width workspace canvas */
:root {
  --bg: #ffffff; --side: #fafafa; --bg-wall: #f4f5f8; --wash-1: #e4dfff; --wash-2: #ffe5d8; --wash-3: #d6f2ea;
  --surface: #ffffff; --surface-2: rgba(15, 15, 16, .03); --surface-hover: rgba(15, 15, 16, .055);
  --line: rgba(15, 15, 16, .08); --line-2: rgba(15, 15, 16, .14);
  /* 4-step single-black text ladder */
  --ink: #0f0f10; --ink-fg: #ffffff;
  --fg: rgba(15, 15, 16, .88); --muted: rgba(15, 15, 16, .54); --dim: rgba(15, 15, 16, .40);
  --accent: #2463eb; --ok: #15803d; --warn: #b45309; --bad: #dc2828;
  --claude: #d97757; --claude-bg: #faf9f5; --claude-fg: #3d3929; --claude-line: rgba(61, 57, 41, .14);
  --lift: 0 0 0 1px rgba(0,0,0,.06), 0 1px 1px -.5px rgba(0,0,0,.06), 0 3px 3px -1.5px rgba(0,0,0,.06), 0 6px 6px -3px rgba(0,0,0,.06), 0 12px 12px -6px rgba(0,0,0,.02);
  --ease: cubic-bezier(.4, 0, .2, 1);
  --font-display: "DM Sans", system-ui, -apple-system, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --font-serif: "Newsreader", Georgia, serif;
  --t-page: 500 22px/1.25 var(--font-display);
  --t-sec: 600 15px/1.35 var(--font-display);
  --t-body: 400 14px/1.55 var(--font-body);
  --t-ui: 500 13.5px/1.35 var(--font-body);
  --t-meta: 400 12px/1.4 var(--font-mono);
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --side-w: 236px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: clip; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--fg); font: var(--t-body); caret-color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
::selection { background: var(--ink); color: #fff; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(15,15,16,.15); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }
svg.logo { width: 15px; height: 15px; flex: none; display: block; }

/* App shell: expandable/closable left sidebar + full-width workspace stage */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100dvh; transition: grid-template-columns 220ms var(--ease); }
body.side-closed .app { grid-template-columns: 0px minmax(0, 1fr); }
.side { position: sticky; top: 0; height: 100dvh; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; padding: 14px 12px; z-index: 25; overflow: hidden; transition: opacity 180ms var(--ease), padding 220ms var(--ease); }
body.side-closed .side { opacity: 0; padding-inline: 0; border-right-color: transparent; pointer-events: none; }
.side-top { display: grid; gap: 12px; padding-inline: 4px; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.side-btn { width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none; transition: color 75ms var(--ease), background 75ms var(--ease); }
.side-btn:hover { color: var(--ink); background: var(--surface-2); }
.side-btn svg { width: 17px; height: 17px; }
.brand { display: flex; align-items: center; gap: 9px; font: 600 15px var(--font-display); color: var(--ink); letter-spacing: -.02em; white-space: nowrap; border: 0; background: none; padding: 0; cursor: pointer; }
.brand i { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(from 200deg, #ffb59a, #c8b8ff, #9fe3d0, #ffb59a); box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }
.acct-switch { max-width: 190px; border: 0; background: var(--surface); color: var(--ink); font: 500 12.5px var(--font-body); height: 32px; padding: 0 10px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-2); cursor: pointer; }
nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; scrollbar-width: none; }
nav button { width: 100%; border: 0; background: none; color: var(--muted); font: var(--t-ui); padding: 8px 10px; min-height: 36px; border-radius: 8px; cursor: pointer; display: flex; gap: 9px; align-items: center; text-align: left; white-space: nowrap; transition: color 75ms var(--ease), background 75ms var(--ease); }
nav button svg.nav-ic { width: 16px; height: 16px; flex: none; opacity: .72; }
nav button[aria-selected="true"] svg.nav-ic { opacity: 1; }
nav button:hover { color: var(--ink); background: var(--surface-2); }
nav button[aria-selected="true"] { color: var(--ink); background: rgba(15, 15, 16, .07); }
nav .n { font: 500 11px var(--font-mono); background: var(--ink); color: var(--ink-fg); border-radius: 99px; padding: 1px 7px; font-variant-numeric: tabular-nums; margin-left: auto; }
.side-foot { display: flex; align-items: center; justify-content: space-between; padding: 12px 6px 2px; border-top: 1px solid var(--line); font: 400 11.5px var(--font-mono); color: var(--dim); }
.mode { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 2px; height: 32px; box-shadow: inset 0 0 0 1px var(--line); }
.mode button { border: 0; background: none; color: var(--muted); font: 500 12px var(--font-body); padding: 0 9px; border-radius: 6px; cursor: pointer; transition: color 75ms var(--ease), background 75ms var(--ease); }
.mode button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }

.stage { min-width: 0; display: flex; flex-direction: column; }
header.topbar { position: sticky; top: 0; z-index: 20; min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 24px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
body[data-tab="wall"] header.topbar { background: color-mix(in srgb, var(--bg-wall) 84%, transparent); }
.top-left, .top-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.crumb { display: flex; align-items: center; gap: 6px; font: 500 13.5px var(--font-body); color: var(--muted); white-space: nowrap; }
.crumb-home { border: 0; background: none; padding: 4px 7px; border-radius: 7px; font: inherit; color: var(--muted); cursor: pointer; transition: color 75ms var(--ease), background 75ms var(--ease); }
.crumb-home:hover { color: var(--ink); background: var(--surface-2); }
.crumb b { color: var(--ink); font-weight: 500; }
.back-home { display: inline-flex; align-items: center; gap: 4px; border: 0; background: var(--surface-2); color: var(--fg); font: 500 12.5px var(--font-body); height: 30px; padding: 0 10px; border-radius: 7px; cursor: pointer; transition: background 75ms var(--ease), color 75ms var(--ease); }
.back-home:hover { background: var(--surface-hover); color: var(--ink); }
.back-home[hidden] { display: none; }
.wrap { width: 100%; max-width: none; padding: 24px clamp(20px, 3vw, 40px) 84px; }
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }

@media (max-width: 860px) {
  .app, body.side-closed .app { grid-template-columns: 1fr; }
  .side, body.side-closed .side { position: sticky; top: 0; height: auto; opacity: 1; pointer-events: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 14px; gap: 8px; }
  .side-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0; }
  .side-head { flex: 1; }
  .side-head .side-btn { display: none; }
  nav { flex-direction: row; overflow-x: auto; gap: 4px; }
  nav button { width: auto; flex: none; padding: 6px 11px; }
  .side-foot { display: none; }
  header.topbar { padding: 6px 14px; flex-wrap: wrap; }
  header.topbar .side-btn, header.topbar .crumb { display: none; }
  .acct-switch { max-width: 140px; }
  .wrap { padding: 18px 16px 72px; }
}

/* Quiet Studio OS — Action Cockpit + Sculpted 3D Orbit Stage */
.cockpit-top { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, .95fr); gap: 24px; align-items: stretch; }
.cockpit-left { display: grid; align-content: center; gap: 16px; min-width: 0; }
.cockpit-hi { margin: 0; font: 400 clamp(24px, 2.4vw, 30px)/1.2 var(--font-display); letter-spacing: -.025em; color: var(--ink); }
.cockpit-hi span { color: var(--muted); }
.composer { background: var(--surface); border-radius: 16px; padding: 14px 14px 10px; box-shadow: var(--lift); display: grid; gap: 10px; }
.comp-tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.comp-tabs button { border: 0; background: none; color: var(--muted); font: 500 12.5px var(--font-body); padding: 5px 10px; border-radius: 7px; cursor: pointer; transition: color 75ms var(--ease), background 75ms var(--ease); }
.comp-tabs button:hover { color: var(--ink); background: var(--surface-2); }
.comp-tabs button[aria-pressed="true"] { color: var(--ink); background: rgba(15,15,16,.07); }
.composer textarea { border: 0; outline: 0; background: transparent; resize: none; min-height: 68px; max-height: 60vh; font: 400 14.5px/1.55 var(--font-body); color: var(--ink); width: 100%; padding: 2px 4px; }
.composer textarea::placeholder { color: var(--dim); }
.qchips { display: flex; flex-wrap: wrap; gap: 6px; }
.qchip { border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--muted); font: 500 12.5px var(--font-body); height: 32px; padding: 0 12px; border-radius: 99px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: color 75ms var(--ease), background 75ms var(--ease); }
.qchip:hover { color: var(--ink); background: var(--surface-2); }

.orb-stage { position: relative; min-height: 300px; border-radius: 18px; background: radial-gradient(70% 70% at 50% 42%, #ffffff 0%, #f5f6f9 68%, #eceef3 100%); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; display: grid; }
.orb-stage::after { content: ""; position: absolute; left: 50%; bottom: 26px; width: 140px; height: 22px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse, rgba(15,15,16,.11) 0%, transparent 72%); pointer-events: none; z-index: 0; }
.orb-stage .orb { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.orb-stage .orb canvas { width: 100%; height: 100%; display: block; }
.orb-meta-top, .orb-meta-bot { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; pointer-events: none; }
.orb-meta-bot { align-self: end; }
.orb-pill { display: inline-flex; align-items: center; gap: 7px; font: 500 11.5px var(--font-mono); color: var(--fg); background: rgba(255,255,255,.82); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); color: var(--ok); animation: ping 2s infinite; }

.kpi-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { text-align: left; border: 0; background: var(--surface); border-radius: 12px; padding: 14px 16px; box-shadow: 0 0 0 1px var(--line); display: grid; gap: 6px; cursor: pointer; transition: box-shadow 120ms var(--ease), background 120ms var(--ease); }
.kpi:hover { box-shadow: 0 0 0 1px var(--line-2); background: rgba(15,15,16,.012); }
.kpi span { font: 500 12.5px var(--font-body); color: var(--muted); }
.kpi b { font: 500 22px/1.1 var(--font-display); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi.warn b { color: var(--warn); } .kpi.bad b { color: var(--bad); } .kpi.ok b { color: var(--ok); }

.home-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.home-foot { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.mini-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); transition: box-shadow 120ms var(--ease); }
.mini-row:hover { box-shadow: 0 0 0 1px var(--line-2); }
.mini-main { min-width: 0; display: grid; gap: 3px; }
.mini-main b { font: 500 13.5px var(--font-body); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-main span { font: 400 12px var(--font-mono); color: var(--muted); }
.growth { max-width: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.growth h2 { margin: 0; font: var(--t-sec); color: var(--ink); }
@media (max-width: 960px) { .cockpit-top, .home-grid, .home-foot { grid-template-columns: 1fr; } .orb-stage { min-height: 240px; } .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* claude panel */
.claude { width: min(640px, 100%); max-height: calc(100dvh - 150px); overflow-y: auto; display: grid; gap: 14px; animation: rise .45s cubic-bezier(.2, .8, .2, 1); scrollbar-width: thin; }
.claude-hi { display: flex; align-items: center; gap: 12px; font: 300 clamp(30px, 4.4vw, 42px)/1.15 var(--font-serif); letter-spacing: -.01em; }
.claude-hi svg { width: 34px; height: 34px; color: var(--claude); flex: none; }
.pbox { background: var(--claude-bg); border: 1px solid var(--claude-line); border-radius: 20px; padding: 14px 14px 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px -18px rgba(60, 40, 20, .3); display: grid; gap: 8px; }
.pbox textarea { border: 0; outline: 0; background: transparent; resize: none; min-height: 56px; max-height: 60vh; font: 400 16px/1.5 var(--font-body); color: var(--claude-fg); width: 100%; padding: 4px 6px; }
.pbox textarea::placeholder { color: color-mix(in srgb, var(--claude-fg) 45%, transparent); }
.ptools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ptools select { appearance: none; border: 1px solid var(--claude-line); background: transparent; color: var(--claude-fg); font: 400 13px var(--font-body); padding: 6px 10px; border-radius: 10px; cursor: pointer; }
.ptools .sp { flex: 1; }
.ibtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--claude-line); background: transparent; color: var(--claude-fg); display: grid; place-items: center; cursor: pointer; }
.ibtn svg { width: 17px; height: 17px; }
.ibtn.send { background: var(--claude); border-color: var(--claude); color: #fff; }
.ibtn:disabled { opacity: .45; cursor: not-allowed; }
.ibtn.on { color: var(--claude); border-color: var(--claude); box-shadow: 0 0 0 3px color-mix(in srgb, var(--claude) 18%, transparent); }
@property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.ibtn.vmode { width: 38px; height: 38px; border-radius: 50%; border: 0; color: #fff; position: relative; isolation: isolate;
  background: conic-gradient(from var(--spin), #7aa8ff, #c58bff, #ff9ac2, #8ff0d8, #7aa8ff); animation: vspin 5s linear infinite;
  box-shadow: 0 4px 14px -4px rgba(140, 110, 255, .55), inset 0 0 0 1px rgba(255, 255, 255, .35); transition: transform .2s; }
.ibtn.vmode::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), transparent 60%); z-index: -1; }
.ibtn.vmode:hover { transform: scale(1.06); }
.ibtn.vmode svg { width: 18px; height: 18px; }
.ibtn.vmode rect { transform-box: fill-box; transform-origin: center; animation: bars 1.1s ease-in-out infinite; }
.ibtn.vmode rect:nth-child(2) { animation-delay: .15s; } .ibtn.vmode rect:nth-child(3) { animation-delay: .3s; } .ibtn.vmode rect:nth-child(4) { animation-delay: .45s; }
@keyframes vspin { to { --spin: 360deg; } }
@keyframes bars { 50% { transform: scaleY(.45); } }
.txtbtn { border: 0; background: none; color: var(--muted); font: 400 13px var(--font-body); cursor: pointer; padding: 6px 8px; border-radius: 8px; }
.txtbtn:hover { color: var(--fg); background: var(--surface-2); }
.answer { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; display: grid; gap: 8px; }
.answer .by { display: flex; gap: 8px; align-items: center; font: 400 11px var(--font-mono); color: var(--muted); }
.answer .by svg { width: 14px; height: 14px; color: var(--claude); }
.thinking { display: inline-flex; gap: 4px; } .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--claude); animation: bob 1s infinite; } .thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
.inbox { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.inbox div { display: flex; gap: 8px; min-width: 0; } .inbox span:last-child { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* overlays: voice + sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(24px); animation: fade .3s; padding: 16px; }
.voice { position: fixed; inset: 0; z-index: 80; background: var(--claude-bg); color: var(--claude-fg); display: grid; grid-template-rows: auto 1fr auto; animation: fade .35s;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.voice-top { display: flex; justify-content: center; align-items: center; gap: 8px; font: 400 13px var(--font-body); color: color-mix(in srgb, var(--claude-fg) 60%, transparent); }
.voice-top svg { width: 16px; height: 16px; color: var(--claude); }
.voice-mid { display: grid; place-items: center; align-content: center; gap: clamp(8px, 2.4vh, 22px); text-align: center; min-height: 0; overflow: hidden; padding-block: 8px; }
.voice canvas { width: min(280px, 64vw, 34vh); height: min(280px, 64vw, 34vh); flex: none; }
.voice p { margin: 0; font: 300 clamp(18px, 3vh, 24px)/1.4 var(--font-serif); max-width: 30ch; min-height: 1.4em; max-height: 5.6em; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.voice small { font: 400 13px var(--font-body); color: color-mix(in srgb, var(--claude-fg) 55%, transparent); max-width: 36ch; }
.voice textarea { position: absolute; left: 50%; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; resize: none; caret-color: transparent; font-size: 16px; }
.voice-mid { position: relative; cursor: text; }
.voice-top { position: relative; z-index: 2; }
.voice-top .pickwrap { position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
.voice-top .menu { left: auto; right: 0; max-height: 50vh; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
html.locked, html.locked body { overflow: hidden; }
.voice .hint { display: inline-flex; gap: 6px; align-items: center; font: 400 13px var(--font-body); color: color-mix(in srgb, var(--claude-fg) 60%, transparent); }
.voice kbd { font: 500 12px var(--font-mono); border: 1px solid var(--claude-line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; background: var(--surface); color: var(--claude-fg); }
.voice .hint[hidden] { display: none; }
.vbtn .ic-max, .voice.mini .vbtn .ic-min { display: none; } .voice.mini .vbtn .ic-max { display: block; }
.voice.mini { inset: auto max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) auto; width: min(340px, calc(100vw - 32px));
  grid-template-rows: none; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 10px 8px 8px; border-radius: 22px;
  border: 1px solid var(--claude-line); box-shadow: 0 18px 50px -16px rgba(30, 20, 60, .35); animation: rise .25s ease-out; }
.voice.mini .voice-top, .voice.mini .hint, .voice.mini .did { display: none; }
.voice.mini .voice-mid { display: flex; gap: 10px; align-items: center; justify-content: flex-start; padding: 0; text-align: left; }
.voice.mini canvas { width: 52px; height: 52px; }
.voice.mini p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 14px; min-height: 0; max-height: 2.8em; max-width: none; }
.voice.mini p:empty::before { content: "Listening…"; color: color-mix(in srgb, var(--claude-fg) 55%, transparent); }
.voice.mini .voice-bot { padding: 0; gap: 6px; }
.voice.mini .vbtn { width: 36px; height: 36px; } .voice.mini .vbtn svg { width: 16px; height: 16px; }
.voice .did { font: 400 12px var(--font-mono); color: var(--claude); min-height: 1.4em; }
.voice-bot { display: flex; justify-content: center; gap: 22px; padding-top: 12px; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.textpost { padding: 12px 14px; background: var(--surface-2); border-radius: 10px; }
.btn { font: 500 13.5px var(--font-body); border-radius: 10px; padding: 8px 14px; min-height: 38px; border: 0; box-shadow: inset 0 0 0 1px var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; transition: background 75ms var(--ease), color 75ms var(--ease), transform 75ms var(--ease), box-shadow 75ms var(--ease); }

/* growth: one still section under the wall; followers line per account + 4 tiles */

const TRACKING_EXACT = new Set(["fbclid", "gclid", "igsh", "igshid", "si", "s", "t", "ref", "ref_src", "ref_url", "feature", "pp", "rcm", "trk"]);
function detectPlatform(url) {
  try {
    const h = new URL(url).hostname.toLowerCase().replace(/^www\./, "");
    if (h.includes("instagram.com") || h.includes("instagr.am")) return "instagram";
    if (h.includes("youtube.com") || h.includes("youtu.be")) return "youtube";
    if (h === "x.com" || h === "twitter.com" || h === "mobile.twitter.com") return "x";
    if (h.includes("linkedin.com")) return "linkedin";
    if (h.includes("threads.net") || h.includes("threads.com")) return "threads";
    if (h.includes("facebook.com") || h.includes("fb.watch")) return "facebook";
    if (h.includes("github.com")) return "github";
    if (h.includes("reddit.com") || h.includes("redd.it")) return "reddit";
    if (h.includes("news.ycombinator.com")) return "hackernews";
  } catch {}
  return "web";
}
function normalizeUrl(rawUrl) {
  try {
    const u = new URL(rawUrl.trim().replace(/[.,;:!?)]+$/, ""));
    u.hostname = u.hostname.toLowerCase().replace(/^www\./, "");
    if (u.hostname === "twitter.com" || u.hostname === "mobile.twitter.com") u.hostname = "x.com";
    else if (u.hostname === "instagr.am") u.hostname = "instagram.com";
    for (const k of [...u.searchParams.keys()]) {
      const low = k.toLowerCase();
      if (TRACKING_EXACT.has(low) || low.startsWith("utm_")) u.searchParams.delete(k);
    }
    u.hash = "";
    u.pathname = u.pathname.replace(/\/+/g, "/").replace(/\/+$/, "") || "/";
    if (u.hostname === "instagram.com") {
      const m = u.pathname.match(/^\/(?:p|reel|reels|tv)\/([A-Za-z0-9_-]+)/i);
      if (m) u.pathname = `/reel/${m[1]}`;
    }
    return u.toString();
  } catch { return rawUrl.trim(); }
}

function extractUrls(text) {
  const m = String(text || "").match(/https?:\/\/[^\s<>"'\]\)]+/gi) || [];
  const seen = new Set(), out = [];
  for (const r of m) {

function expiryInfo(item) {
  if (!item) return { shelf: "evergreen", state: "evergreen", hoursLeft: null, daysLeft: null, label: "Evergreen", cls: "sh-evergreen" };
  const shelf = String(item.shelfLife || "evergreen").toLowerCase();
  const defHours = shelf === "update" ? 48 : shelf === "trend" ? 168 : null;
  let expMs = item.expiresAt ? Date.parse(item.expiresAt) : NaN;
  if (isNaN(expMs) && defHours != null && item.createdAt) {
    const cMs = Date.parse(item.createdAt);
    if (!isNaN(cMs)) expMs = cMs + defHours * 36e5;
  }
  if (shelf === "evergreen" && isNaN(expMs)) {
    return { shelf: "evergreen", state: "evergreen", hoursLeft: null, daysLeft: null, label: "Evergreen", cls: "sh-evergreen" };
  }
  if (isNaN(expMs)) {
    const lbl = shelf === "update" ? "Update · 48h window" : "Trend · 7d window";
    return { shelf, state: "active", hoursLeft: defHours || 168, daysLeft: Math.round((defHours || 168) / 24), label: lbl, cls: shelf === "update" ? "sh-update" : "sh-trend" };
  }
  const deltaH = (expMs - Date.now()) / 36e5;
  const hoursLeft = Math.round(deltaH);
  const daysLeft = Math.round(deltaH / 24);
  if (deltaH <= 0) {
    const agoD = Math.max(1, Math.round(Math.abs(deltaH) / 24));
    return { shelf, state: "expired", hoursLeft, daysLeft, agoDays: agoD, label: "Expired · avoid", cls: "sh-expired" };
  }
  const kindLbl = shelf === "update" ? "Update" : "Trend";
  if (deltaH <= 24) {
    return { shelf, state: "expiring_today", hoursLeft: Math.max(1, hoursLeft), daysLeft: 1, label: `${kindLbl} · ${Math.max(1, hoursLeft)}h left`, cls: "sh-update" };
  }
  return { shelf, state: "active", hoursLeft, daysLeft: Math.max(1, daysLeft), label: `${kindLbl} · ${Math.max(1, daysLeft)}d left`, cls: shelf === "update" ? "sh-update" : "sh-trend" };
}

function findHeaters(posts) {
  const byAcc = {};
  for (const p of posts || []) {
    const v = p.metrics?.views;
    if (p.status !== "posted" || v == null || v <= 0) continue;
    (byAcc[p.accountId || "all"] ||= []).push(p);
  }
  const out = [];
  for (const [acc, list] of Object.entries(byAcc)) {
    if (list.length < 3) continue;
    const sorted = list.map(x => x.metrics.views).sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    const med = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    if (med <= 0) continue;
    for (const p of list) {
      const mult = +(p.metrics.views / med).toFixed(1);
      if (mult < 2.0) continue;
      const ageDays = p.postedAt ? Math.max(0, Math.round((Date.now() - Date.parse(p.postedAt)) / 864e5)) : 0;
      const evergreenRecycle = ageDays >= 90 && (p.shelfLife || "evergreen") === "evergreen";
      out.push({ post: p, accountId: acc, views: p.metrics.views, median: Math.round(med), mult, ageDays, evergreenRecycle });
    }
  }
  return out.sort((a, b) => b.mult - a.mult || b.views - a.views);
}

/* ---------- 3D Studio Liquid-Glass Pearl Sphere + Dual Gyroscopic Orbits ---------- */
let orb3d = null;
function startOrb() {

  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(34, 1, .1, 100); cam.position.set(0, 0, 8.2);
  const uni = { t: { value: 0 }, mouse: { value: new THREE.Vector2(0, 0) } };
  const mat = new THREE.ShaderMaterial({
    uniforms: uni, transparent: true,
    vertexShader: `uniform float t; uniform vec2 mouse; varying vec3 vN; varying vec3 vP; varying vec3 vObj;
      void main(){
        vec3 p = position;
        float w1 = sin(p.x * 1.65 + t * .55) * cos(p.y * 1.55 - t * .42) * sin(p.z * 1.45 + t * .38);
        float w2 = sin((p.x + p.y) * 2.4 - t * .7) * .35;
        p += normal * (w1 + w2) * .026;
        vObj = normalize(p);
        vN = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(p, 1.);
        vP = -mv.xyz;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `uniform float t; uniform vec2 mouse; varying vec3 vN; varying vec3 vP; varying vec3 vObj;
      vec3 irid(float x){
        // Delicate Apple-pearl / optical thin-film spectrum (silver-lilac, cool sky, warm Claude terracotta)
        vec3 a = vec3(.86, .87, .91);
        vec3 b = vec3(.14, .11, .14);
        vec3 c = vec3(1., 1., 1.);
        vec3 d = vec3(.06, .18, .36);
        return a + b * cos(6.28318 * (c * x + d));
      }
      void main(){
        vec3 n = normalize(vN);
        vec3 v = normalize(vP);
        float ndv = max(dot(n, v), 0.);
        float fres = pow(1. - ndv, 2.6);
        float rim = pow(1. - ndv, 4.5);

        // Studio environment reflection (overhead softbox + horizon graphite band + alabaster floor bounce)
        vec3 R = reflect(-v, n);
        float horizon = smoothstep(-.18, .28, R.y);
        vec3 studioLow = vec3(.14, .15, .18);     // architectural graphite reflection
        vec3 studioMid = vec3(.82, .83, .87);     // brushed platinum silver
        vec3 studioTop = vec3(.98, .985, 1.0);    // bright studio softbox sky
        vec3 env = mix(studioLow, studioMid, smoothstep(-.55, .05, R.y));
        env = mix(env, studioTop, smoothstep(.08, .65, R.y));

        // Flowing internal silk light-ribbon (BlueYard glass inspiration)
        float ribbon = smoothstep(.62, .98, sin(vObj.y * 3.8 + vObj.x * 2.2 + t * .65 + mouse.x * 1.4) * .5 + .5);
        vec3 pearl = irid(fres * 1.35 + vObj.y * .28 + t * .06);
        vec3 claudeWarm = vec3(.93, .58, .44);    // subtle warm terracotta refraction kiss

        // Crisp 3-point studio speculars (softbox key + cool rim)
        vec3 L1 = normalize(vec3(-.55, .78, .65));
        vec3 L2 = normalize(vec3(.75, -.25, .45));
        vec3 H1 = normalize(L1 + v);
        vec3 H2 = normalize(L2 + v);
        float specKey = pow(max(dot(n, H1), 0.), 90.) * .95;
        float specSoft = pow(max(dot(n, H1), 0.), 16.) * .26;
        float specWarm = pow(max(dot(n, H2), 0.), 26.) * .28;

        // Compose ceramic-glass body: deep sculpted core -> platinum mid -> iridescent optical rim
        vec3 col = mix(env * .92, pearl, .28 + fres * .58);
        col = mix(col, vec3(.99, .99, 1.0), ribbon * .22);
        col += claudeWarm * specWarm * (.45 + fres);
        col += vec3(1.) * (specSoft + specKey);
        col = mix(col, vec3(1.), rim * .72);

        gl_FragColor = vec4(col, .97);
      }`
  });

  const group = new THREE.Group(); scene.add(group);
  const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(1.48, 56), mat);
  group.add(ball);

  // Outer precision graphite orbital ring (carries the 6 machined platform medallions)
  const R_OUT = 2.32;
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(R_OUT, .0055, 8, 220),
    new THREE.MeshBasicMaterial({ color: 0x0f0f10, transparent: true, opacity: .14 })
  );
  ring.rotation.x = 1.18; ring.rotation.y = -.24; group.add(ring);

  // Inner counter-rotating platinum gyroscopic ring + 2 micro telemetry nodes
  const ring2 = new THREE.Mesh(
    new THREE.TorusGeometry(1.88, .004, 8, 180),
    new THREE.MeshBasicMaterial({ color: 0x0f0f10, transparent: true, opacity: .075 })
  );
  ring2.rotation.x = 1.42; ring2.rotation.y = .48; group.add(ring2);
  const dotMat1 = new THREE.MeshBasicMaterial({ color: 0x0f0f10, transparent: true, opacity: .55 });
  const dotMat2 = new THREE.MeshBasicMaterial({ color: 0xd97757, transparent: true, opacity: .85 });
  const d1 = new THREE.Mesh(new THREE.SphereGeometry(.038, 16, 16), dotMat1); d1.position.set(1.88, 0, 0); ring2.add(d1);
  const d2 = new THREE.Mesh(new THREE.SphereGeometry(.044, 16, 16), dotMat2); d2.position.set(-1.88, 0, 0); ring2.add(d2);

  // Machined glass-rimmed studio medallions (256px crisp retina canvas)
  const sprites = ["instagram", "linkedin", "x", "youtube", "facebook", "threads"].map((name, i) => {
    const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
    // Soft ambient shadow + pure white ceramic disk + 1px hairline silver rim
    g.shadowColor = "rgba(15,15,16,0.14)"; g.shadowBlur = 18; g.shadowOffsetY = 6;
    g.fillStyle = "#ffffff"; g.beginPath(); g.arc(128, 124, 96, 0, Math.PI * 2); g.fill();
    g.shadowColor = "transparent";
    g.strokeStyle = "rgba(15,15,16,0.11)"; g.lineWidth = 3; g.stroke();
    g.save();
    g.translate(76, 72); g.scale(4.35, 4.35);
    g.fillStyle = { instagram: "#e1306c", linkedin: "#0a66c2", youtube: "#ff0033", facebook: "#0866ff" }[name] || "#0f0f10";
    g.fill(new Path2D(ICONS[name]));
    g.restore();
    const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: true }));
    s.scale.setScalar(.42);
    s.position.set(Math.cos(i / 6 * Math.PI * 2) * R_OUT, Math.sin(i / 6 * Math.PI * 2) * R_OUT, 0);
    ring.add(s); return s;
  });

  let mx = 0, my = 0, sx = 0, sy = 0;
  addEventListener("pointermove", e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
  const canvas = renderer.domElement;
  const worldPos = new THREE.Vector3();
  function resize() {
    const h = canvas.parentElement; if (!h) return;
    const w = h.clientWidth, ht = h.clientHeight; if (!w || !ht) return;
    renderer.setSize(w, ht, false); cam.aspect = w / ht; cam.updateProjectionMatrix();
    const sc = Math.min(.88, Math.max(.62, Math.min(w, ht) / 335));
    group.position.set(0, .04, 0);
    group.scale.setScalar(sc);
  }
  addEventListener("resize", resize);
  const t0 = performance.now();
  function frame(now) {
    if (!canvas.isConnected) { orb3d.running = false; return; }
    if (document.body.classList.contains("intro-wait")) { requestAnimationFrame(frame); return; }
    const t = (now - t0) / 1000;
    sx += (mx - sx) * .055; sy += (my - sy) * .055; // silky spring-damped inertia
    uni.t.value = t; uni.mouse.value.set(sx, sy);
    ball.rotation.y = t * .14 + sx * .55;
    ball.rotation.x = sy * .32;
    ring.rotation.z = t * .16;
    ring2.rotation.z = -t * .24;
    group.rotation.y = sx * .28;
    group.rotation.x = sy * .18;
    // Depth-of-field parallax on orbiting medallions (front = crisp & larger, back = softer & smaller)
    for (const s of sprites) {
      s.getWorldPosition(worldPos);
      const depth = Math.max(0, Math.min(1, (worldPos.z + 2.3) / 4.6));
      s.scale.setScalar(.30 + depth * .15);
      s.material.opacity = .42 + depth * .58;
    }
    renderer.render(scene, cam);
    if (!REDUCED) requestAnimationFrame(frame); else orb3d.running = false;
  }
  orb3d = { canvas, resize, running: true, go() { this.running = true; requestAnimationFrame(frame); } };
  host.append(canvas); resize(); requestAnimationFrame(frame);
}

/* ---------- voice mode ---------- */
// Artifact pages get no microphone, so speech arrives through the OS dictation (Win+H) or the phone keyboard mic,
// typed into a hidden box. The blob reacts to each word, a 2 s pause sends it, and the reply is spoken with a
// browser voice the user picks. As an agent it can save ideas and leave notes; it can never approve or publish.
let voice = null;
const isTouch = matchMedia("(pointer: coarse)").matches;
function voiceList() {
  const all = ("speechSynthesis" in window ? speechSynthesis.getVoices() : []).filter(v => /^en/i.test(v.lang));
  const female = /female|neerja|aria|jenny|sonia|libby|emma|ava|michelle|natasha|clara|samantha|zira|heera|karen|moira|tessa|serena|veena|susan|hazel/i;
  const score = v => (female.test(v.name) ? 10 : 0) + (/natural|neural/i.test(v.name) ? 3 : 0) + (/neerja/i.test(v.name) ? 2 : 0) + (/google/i.test(v.name) ? 2 : 0) + (/en-(in|gb|us)/i.test(v.lang) ? 1 : 0);
  return all.sort((x, y) => score(y) - score(x)).slice(0, 12);
}
function pickedVoice() { const vs = voiceList(), want = store.get("sos.voice", ""); return vs.find(v => v.name === want) || vs[0] || null; }
function refreshVoicePicks() {
  PICKS.voice = { key: "sos.voice", def: pickedVoice()?.name || "", items: Object.fromEntries(voiceList().map(v => [v.name, [v.name.replace(/^Microsoft |^Google /, "").replace(/ Online \(Natural\)/, " · natural").split(" - ")[0], v.lang]])) };
  const b = document.querySelector('[data-pick="voice"]'); if (b) b.firstChild.textContent = (pickedVoice()?.name || "Voice").replace(/^Microsoft |^Google /, "").replace(/ Online \(Natural\).*/, "").split(" - ")[0];
}
if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = refreshVoicePicks; refreshVoicePicks(); }

function openVoice() {
  refreshVoicePicks();
  const el = document.createElement("div"); el.className = "voice";
  el.innerHTML = `<div class="voice-top">${svg("claude")}${(MODELS[store.get("sos.model", "sonnet")] || MODELS.sonnet).label} · voice
      ${PICKS.voice && Object.keys(PICKS.voice.items).length ? `<div class="pickwrap"><button class="pick" data-pick="voice" aria-haspopup="menu" aria-expanded="false">Voice${CHEV}</button></div>` : ""}</div>
    <div class="voice-mid"><canvas width="560" height="560"></canvas><p data-say></p><span class="did" data-did></span>
      <span class="hint" data-hint>${isTouch ? "Tap the mic on your keyboard and speak" : "Press <kbd>Win</kbd> + <kbd>H</kbd> and speak"}</span>
      <textarea id="voice-text" rows="1" aria-label="What you said" autocomplete="off"></textarea></div>
    <div class="voice-bot"><button class="vbtn" data-voice="mini" aria-label="Minimise" title="Minimise"><svg class="ic-min" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg><svg class="ic-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button><button class="vbtn" data-voice="end" aria-label="End voice">${XICON}</button></div>`;
  document.body.append(el); document.documentElement.classList.add("locked");

  const cv = el.querySelector("canvas"), g = cv.getContext("2d"), say = el.querySelector("[data-say]"), hint = el.querySelector("[data-hint]"), didEl = el.querySelector("[data-did]"), ta = el.querySelector("#voice-text");
  let level = .15, target = .15, phase = "listen", raf = 0, rec = null, finalText = "", pause = 0;
  const history = [];
  const W = 560, C = W / 2;
  const draw = now => {
    const t = now / 1000;

    clearTimeout(pause);

    history.push({ role: "user", content: text }); if (history.length > 8) history.splice(0, history.length - 8);
    if (history[0].role !== "user") history.shift();

        ({ text: so }) => { if (!voice) return; phase = "speak"; say.textContent = so.slice(-200); bump(.12); }, { history, did });

}

function postState(p) {
  if (p.status === "failed") return ["bad", "Failed"];
  if ((p.problems || []).length) return ["warn", `${p.problems.length} to fix`];
  if (expiryInfo(p).state === "expired" && p.status === "waiting") return ["warn", "Expired"];
  return p.status === "waiting" ? ["ok", "Ready"] : ["", p.status];
}
function postCard(p, attr) {
  const [cls, label] = postState(p);
  return `<article class="qcard" ${attr}="${esc(p.id)}" role="button" tabindex="0">
    <div class="q-row"><div class="meta" style="min-width:0">${plat(p.platform)}<span>${esc(p.format)}</span><span>${esc(fmtTime(p.plannedAt))}</span></div><span class="qstate ${cls}">${esc(label)}</span></div>
    <div class="q-row"><p class="q-title clamp2">${esc(p.title || (p.caption || "").split("\n")[0] || "Untitled")}</p><span class="q-go" aria-hidden="true">›</span></div></article>`;
}

function viewApprove() {
  const failed = state.posts.filter(p => p.status === "failed").sort(byTime);
  const w = state.posts.filter(p => p.status === "waiting").sort(byTime);
  const list = [...failed, ...w];
  const cleanWaiting = w.filter(p => !(p.problems || []).length && expiryInfo(p).state !== "expired");
  const head = `<div class="page-head"><div><h2>Approve</h2><p>Tap a post to read it. Nothing goes out until you approve it.</p></div>${cleanWaiting.length > 1 ? `<button class="btn primary" id="approve-all-clean">Approve all ready (${cleanWaiting.length})</button>` : ""}</div>`;
  if (!list.length) { ui.apPick = null; return `${head}${emptyBox("All caught up", "No posts waiting for your approval. Approve a script in Plan or run a pack in Studio to queue new posts.", `<button class="btn primary" data-tab="plan">Open Plan</button>`)}`; }
  let i = -1;
  if (ui.apPick) {
    i = list.findIndex(p => p.id === ui.apPick);
    if (i < 0) { i = Math.min(ui.apIdx || 0, list.length - 1); ui.apPick = list[i].id; rdReset(); }
    ui.apIdx = i;
  }
  const cards = `<section class="list">${band("Waiting for your yes", list.length, failed.length ? "var(--bad)" : "var(--warn)")}<div class="qlist">${list.map(p => postCard(p, "data-ap-open")).join("")}</div></section>`;
  if (i < 0) return head + cards;
  const p = list[i], probs = p.problems || [], exp = expiryInfo(p), isExpired = exp.state === "expired";
  if (ui.rdShownId !== p.id) { ui.rdShownId = p.id; ui.rdShownAt = Date.now(); } // approve taps are ignored for 0.7 s after a new post slides in
  const editing = ui.editingPost === p.id, confirmingNow = ui.confirmNow === p.id, confirmingExp = ui.confirmExpired === p.id;
  const body = `${postMeta(p)}<h2>${esc(p.title || (p.caption || "").split("\n")[0] || "Untitled")}</h2>
    ${p.status === "failed" ? `<div class="problems" style="padding:10px 14px">${esc(p.error || "Publish failed (no error message recorded).")}</div>` : ""}
    ${isExpired ? `<div class="problems" style="padding:10px 14px">This ${esc(exp.shelf)} expired ${esc(exp.agoDays || 1)} day${(exp.agoDays || 1) === 1 ? "" : "s"} ago. Send it back to draft to remake it as evergreen, or approve it twice to post anyway.</div>` : ""}
    ${editing ? `<div class="field">${p.platform === "youtube" ? `<label class="label" for="ed-title-${esc(p.id)}">Title</label><input class="field-in" id="ed-title-${esc(p.id)}" value="${esc(p.title || "")}">` : ""}
      <label class="label" for="ed-cap-${esc(p.id)}">Caption (your edits teach Claude your voice)</label>
      <textarea class="field-in" id="ed-cap-${esc(p.id)}">${esc(p.caption || "")}</textarea>
      <div class="row"><button class="btn primary" data-edit-save="${esc(p.id)}">Save edits</button><button class="btn" data-edit-cancel="${esc(p.id)}">Cancel</button></div></div>` : renderPostBody(p)}
    ${probs.length ? `<ul class="problems">${probs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${p.audioNote ? `<span class="muted">Add the sound by hand: post from the Instagram app with "${esc(p.audioNote)}".</span>` : ""}`;
  let foot;
  if (p.status === "failed") foot = `<div class="row"><button class="btn ghost danger" data-act="rejected" data-id="${esc(p.id)}">Reject</button><button class="btn primary" data-act="approved" data-id="${esc(p.id)}">Retry</button></div>`;
  else if (ui.draftAsk === p.id) foot = `<input class="field-in" id="fb-${esc(p.id)}" placeholder="What should change? (optional, teaches Claude)" maxlength="300">
    <div class="row"><button class="btn ghost" data-draft-ask="">Cancel</button><button class="btn primary" data-act="draft" data-id="${esc(p.id)}">Send back to draft</button></div>`;
  else foot = `<div class="row">
      <button class="btn ghost danger" data-act="rejected" data-id="${esc(p.id)}">Reject</button>
      <button class="btn ghost" data-draft-ask="${esc(p.id)}">Back to draft</button>
      ${!editing ? `<button class="btn ghost" data-edit-open="${esc(p.id)}">Edit</button>` : ""}
      ${p.platform !== "x" ? `<button class="btn" data-act="now" data-id="${esc(p.id)}" ${probs.length ? "disabled" : ""}>${confirmingNow ? "Tap again to post now" : "Approve + post now"}</button>` : ""}
      <button class="btn primary" data-act="approved" data-id="${esc(p.id)}" ${probs.length ? "disabled title=\"Fix the problems first\"" : ""}>${isExpired && !confirmingExp ? "Expired · Approve anyway?" : confirmingExp ? "Tap again to approve" : "Approve"}</button></div>`;
  return head + cards + rdShell(p.id, i, list.length, body, foot);
}

function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const parts = new Intl.DateTimeFormat("sv-SE", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).format(d);
  return parts.replace(" ", "T");
}

function viewCalendarList() {
  const days = [];
  for (let i = 0; i < 14; i++) days.push(dayKey(new Date(Date.now() + i * 864e5).toISOString()));
  const groups = Object.fromEntries(days.map(d => [d, []]));
  for (const p of state.posts) if (p.plannedAt && groups[dayKey(p.plannedAt)] && p.status !== "rejected") groups[dayKey(p.plannedAt)].push(p);
  const any = days.some(d => groups[d].length);
  const dayName = d => new Intl.DateTimeFormat("en-IN", { timeZone: TZ, weekday: "long", day: "numeric", month: "short" }).format(new Date(d + "T12:00:00+05:30"));
  return `${any ? "" : `<div class="empty">No posts planned in the next two weeks.</div>`}
    ${days.filter(d => groups[d].length).map(d => `<section class="day"><h3>${esc(dayName(d))}<span>${groups[d].length} posts</span></h3>
      ${groups[d].sort(byTime).map(p => `<div class="calpost calrow s-${esc(p.status)}" data-cal-open="${esc(p.id)}" role="button" tabindex="0"><div class="barc"></div><div>

}

/* ---------- Fullscreen Teleprompter v26 (active line highlight, dimmed cues, tap-to-pause, saved speed/size) ---------- */
let tele = null;
function formatTeleHtml(rawText) {
  const blocks = String(rawText || "Not written yet.").split(/\n+/).map(s => s.trim()).filter(Boolean);
  return blocks.map((line, idx) => {
    const withCues = esc(line).replace(/\[([^\]]+)\]/g, (_, c) => `<span class="tele-cue">${c}</span>`);
    return `<div class="tele-line${idx === 0 ? " active" : ""}" data-tline="${idx}">${withCues}</div>`;
  }).join("");
}
function openTeleprompter(s) {
  if (!s) return;
  let lang = ui.lang[s.id] || s.lang || "en", playing = false,
      speed = +store.get("sos.tele.speed", "28") || 28,
      size = +store.get("sos.tele.size", "32") || 32,
      raf = 0, lastT = 0;
  const el = document.createElement("div"); el.className = "tele";
  el.style.setProperty("--tsize", size + "px");
  el.innerHTML = `<div class="tele-top">
      <div><b>${esc(s.title || "Teleprompter")}</b>${s.storyFormat ? ` · <span class="muted">${esc(s.storyFormat)}</span>` : ""} · <span class="muted">Tap script to pause/resume</span></div>
      <div class="row">
        <button class="btn" data-tact="lang">${lang === "ml" ? "ML-EN" : "English"}</button>
        <button class="btn" data-tact="mirror">Mirror</button>
        <button class="btn" data-tact="close">✕ Close</button>
      </div>
    </div>
    <div class="tele-body" id="tele-body" title="Tap anywhere on script to pause or resume">${formatTeleHtml(lang === "ml" ? s.mlen : s.en)}</div>
    <div class="tele-bot">
      <div class="row">
        <button class="btn primary" id="tele-play-btn" data-tact="play">Play scroll</button>
        <button class="btn" data-tact="reset">Top</button>
      </div>
      <div class="row">
        <label class="label" style="color:#fff">Speed <input type="range" id="tele-spd" min="10" max="90" value="${speed}"></label>
        <label class="label" style="color:#fff">Size <input type="range" id="tele-sz" min="20" max="54" value="${size}"></label>
      </div>
    </div>`;
  document.body.append(el); document.documentElement.classList.add("locked");
  const body = el.querySelector("#tele-body"), playBtn = el.querySelector("#tele-play-btn");
  const updateActiveLine = () => {
    const lines = body.querySelectorAll(".tele-line"); if (!lines.length) return;
    const rect = body.getBoundingClientRect(), targetY = rect.top + rect.height * 0.34;
    let best = lines[0], bestDist = 1e9;
    lines.forEach(node => {
      const r = node.getBoundingClientRect(), mid = (r.top + r.bottom) / 2, d = Math.abs(mid - targetY);
      if (d < bestDist) { bestDist = d; best = node; }
    });
    lines.forEach(node => node.classList.toggle("active", node === best));
  };
  body.addEventListener("scroll", updateActiveLine, { passive: true });
  const step = now => {
    if (!playing || !el.isConnected) return;
    if (lastT) { body.scrollTop += (now - lastT) / 1000 * speed; updateActiveLine(); }
    lastT = now; raf = requestAnimationFrame(step);
  };
  const togglePlay = () => {
    playing = !playing;
    if (playBtn) playBtn.textContent = playing ? "Pause" : "Play scroll";
    lastT = 0;
    if (playing) raf = requestAnimationFrame(step); else cancelAnimationFrame(raf);
  };
  body.addEventListener("click", togglePlay);
  el.addEventListener("input", e => {
    if (e.target.id === "tele-spd") { speed = +e.target.value; store.set("sos.tele.speed", String(speed)); }
    if (e.target.id === "tele-sz") { size = +e.target.value; el.style.setProperty("--tsize", size + "px"); store.set("sos.tele.size", String(size)); }
  });
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-tact]"); if (!b) return;
    const a = b.dataset.tact;
    if (a === "close") closeTele();
    else if (a === "mirror") el.classList.toggle("mirror");
    else if (a === "reset") { body.scrollTop = 0; updateActiveLine(); }
    else if (a === "lang") { lang = lang === "ml" ? "en" : "ml"; b.textContent = lang === "ml" ? "ML-EN" : "English"; body.innerHTML = formatTeleHtml(lang === "ml" ? s.mlen : s.en); body.scrollTop = 0; }
    else if (a === "play") togglePlay();
  });
  tele = { close: closeTele };
  function closeTele() { playing = false; cancelAnimationFrame(raf); el.remove(); tele = null; document.documentElement.classList.remove("locked"); }
}

    catch (err) { t.disabled = false; showToast(`Couldn't save: ${err.code || "error"}.`); }
    return;
  }
  if (t.dataset.resched) {
    const val = $("#resched-dt")?.value; if (!val) return showToast("Pick a date and time first.");
    const iso = val + ":00+05:30";
    t.disabled = true;
    try { await db.doc(`posts/${t.dataset.resched}`).update({ plannedAt: iso, updatedAt: nowIso() }); showToast("Rescheduled."); }
    catch (err) { showToast(`Couldn't save: ${err.code || "error"}.`); }
    t.disabled = false; return;
  }
  if (t.dataset.markPosted) {
    const p = state.posts.find(x => x.id === t.dataset.markPosted); if (!p) return;
    t.disabled = true;
    if (!(await setStatus(p, "posted"))) t.disabled = false;
    return;
  }
  if (t.dataset.door) {
    if (!ui.acct) return showToast("Pick one account at the top first.");
    const topic = t.dataset.door === "topic" ? $("#door-topic").value.trim() : "";
    if (t.dataset.door === "topic" && !topic) return showToast("Write the topic or paste a link first.");
    const text = { week: "Plan my week", month: "Plan my month", topic: `One video about: ${topic}` }[t.dataset.door];
    t.disabled = true;
    try { await db.collection("messages").add({ from: "user", kind: t.dataset.door, accountId: ui.acct, text, status: "new", reply: null, createdAt: nowIso() });
      if (t.dataset.door === "topic") $("#door-topic").value = ""; showToast("Saved. Claude brings options in its next chat."); }
    catch (err) { showToast(`Couldn't save: ${err.code || "error"}.`); }
    t.disabled = false; return;
  }
  if (t.dataset.opt) {
    t.disabled = true;
    try { await db.doc(`options/${t.dataset.id}`).update({ status: t.dataset.opt, updatedAt: nowIso() }); showToast(t.dataset.opt === "picked" ? "Picked. Claude writes the script next." : "Dropped"); }
    catch (err) { t.disabled = false; showToast(`Couldn't save: ${err.code || "error"}.`); }
    return;
  }
  if (t.dataset.scr) {
    const note = ($(`#chg-${CSS.escape(t.dataset.id)}`)?.value || "").trim();
    if (t.dataset.scr === "changes" && !note) return showToast("Write what should change first.");
    t.disabled = true;
    const patch = t.dataset.scr === "approved" ? { status: "approved", approvedAt: nowIso(), lang: ui.lang[t.dataset.id] || "en" } : { status: "changes", note };
    try { await db.doc(`scripts/${t.dataset.id}`).update({ ...patch, updatedAt: nowIso() }); showToast(t.dataset.scr === "approved" ? "Script approved. Claude makes every platform version next." : "Sent. Claude rewrites it."); }
    catch (err) { t.disabled = false; showToast(`Couldn't save: ${err.code || "error"}.`); }
    return;
  }
  if (t.dataset.hook) {
    const h = state.hooks.find(x => x.id === t.dataset.hook); if (!h) return;
    const acct = ui.acct || h.accountId || null;
    try {
      await db.collection("messages").add({ from: "user", kind: "topic", accountId: acct, text: `HOOK: ${h.template}${h.example ? ` (example: ${h.example})` : ""}`, status: "new", reply: null, createdAt: nowIso() });
      showToast("Sent to Plan. Claude brings options & script using this hook.");
    } catch (err) { showToast(`Couldn't save: ${err.code || "error"}.`); }
    return;
  }
  if (t.dataset.swap) {
    const p = state.posts.find(x => x.id === ui.calPick);
    if (t.dataset.swap === "close" || !p) { ui.calPick = null; lastKey = ""; render(); return; }
    t.disabled = true;
    try {
      if (t.dataset.swap === "remove") await setStatus(p, "rejected");
      else { await db.collection("messages").add({ from: "user", kind: t.dataset.swap === "own" ? "swap-own" : "swap-options", accountId: p.accountId, postId: p.id,
          text: t.dataset.swap === "own" ? `Swap the ${fmtTime(p.plannedAt)} slot for my own content` : `New options for the ${fmtTime(p.plannedAt)} slot`, status: "new", reply: null, createdAt: nowIso() });
        showToast(t.dataset.swap === "own" ? "Saved. Add your clip in Studio; Claude fits it into this slot." : "Saved. Claude brings new options for this slot."); }
      ui.calPick = null; lastKey = ""; render();
    } catch (err) { t.disabled = false; showToast(`Couldn't save: ${err.code || "error"}.`); }
    return;
  }

  if (t.id === "job-prompt" || t.id === "job-pack") {
    const accountId = $("#job-acct").value, brief = $("#job-brief").value.trim(), clipUrl = $("#job-clip").value.trim();
    const model = $("#job-model")?.value || null, effort = $("#job-effort")?.value || null;
    if (!accountId) return showToast("Add an account first (Accounts tab).");
    if (!brief && !clipUrl) return showToast("Describe the video or add a clip first.");
    t.disabled = true;
    try { await db.collection("jobs").add({ accountId, kind: t.id === "job-pack" ? "pack" : "prompt", brief, clipUrl: clipUrl || null, model, effort,
        status: "requested", prompt: null, postIds: [], note: null, createdAt: nowIso(), updatedAt: nowIso() });
      $("#job-brief").value = ""; $("#job-clip").value = ""; showToast("Saved. Claude writes the prompt in its next chat."); }
    catch (err) { showToast(`Couldn't save: ${err.code || "error"}.`); }
    t.disabled = false;
    return;
  }
  if (t.dataset.act) {
    const p = state.posts.find(x => x.id === t.dataset.id); if (!p) return;
    const exp = expiryInfo(p);
    if ((t.dataset.act === "approved" || t.dataset.act === "now") && exp.state === "expired" && ui.confirmExpired !== p.id) {
      ui.confirmExpired = p.id; lastKey = ""; render();
      showToast(`This ${exp.shelf} expired ${exp.agoDays || 1}d ago. Tap Approve again to post anyway.`);
      return;
    }
    if (t.dataset.act === "now" && ui.confirmNow !== p.id) {
      ui.confirmNow = p.id; lastKey = ""; render();
      showToast("Tap 'Tap again to post now' to confirm immediate publish.");
      return;
    }
    ui.confirmNow = null; ui.confirmExpired = null;
    const fb = t.dataset.act === "draft" ? ($(`#fb-${CSS.escape(p.id)}`)?.value || "").trim() || null : null;
    t.disabled = true;
    if (!(await setStatus(p, t.dataset.act === "now" ? "approved" : t.dataset.act, t.dataset.act === "now", fb ? { feedbackNote: fb } : null))) t.disabled = false;
    return;
  }
  if (t.dataset.copy) {
    const p = state.posts.find(x => x.id === t.dataset.copy); if (!p) return;
    try { await navigator.clipboard.writeText(p.caption); showToast("Copied. Paste it in the app."); }
    catch { showToast("Copy was blocked. Press and hold the text to copy it."); }
    return;
  }
  if (t.id === "comp-save") {
    const link = $("#comp-link").value.trim(); if (!link) return showToast("Paste a profile link first.");
    const platform = /youtube|youtu\.be/i.test(link) ? "youtube" : /linkedin/i.test(link) ? "linkedin" : /x\.com|twitter/i.test(link) ? "x" : /threads/i.test(link) ? "threads" : /facebook/i.test(link) ? "facebook" : "instagram";
    t.disabled = true;
    try { await db.collection("competitors").add({ link, platform, accountId: $("#comp-acct").value || null, note: $("#comp-note").value.trim() || null, source: "user", status: "new", createdAt: nowIso() });
      $("#comp-link").value = ""; $("#comp-note").value = ""; showToast("Saved. Claude studies it in the next research run."); }
    catch (err) { showToast(`Couldn't save: ${err.code || "error"}.`); }
    t.disabled = false;
    return;
  }
  if (t.dataset.compRemove) {
    t.disabled = true;
    try { await db.doc(`competitors/${t.dataset.compRemove}`).update({ status: "remove" }); showToast("Removed."); }
    catch (err) { t.disabled = false; showToast(`Couldn't save: ${err.code || "error"}.`); }
    return;
  }
  if (t.id === "sch-save") {
    const time = $("#sch-time").value; if (!time) return showToast("Pick a time first.");
    t.disabled = true;
    try { await db.collection("schedules").add({ accountId: $("#sch-acct").value || null, kind: $("#sch-kind").value, every: $("#sch-every").value, time, status: "requested", cloudTaskId: null, note: null, createdAt: nowIso(), updatedAt: nowIso() }); showToast("Schedule saved. Claude switches it on next time."); }
    catch (err) { showToast(`Couldn't save: ${err.code || "error"}.`); }
    t.disabled = false;
    return;
  }
  if (t.dataset.sch) {
    t.disabled = true;
    try { await db.doc(`schedules/${t.dataset.id}`).update({ status: t.dataset.sch, updatedAt: nowIso() }); showToast(t.dataset.sch === "remove" ? "Claude removes it next time." : t.dataset.sch === "paused" ? "Paused" : "Resumed"); }
    catch (err) { t.disabled = false; showToast(`Couldn't save: ${err.code || "error"}.`); }
    return;
  }
});
function filterHooks() {
  const q = ($("#hook-q")?.value || "").toLowerCase().trim(), ty = ui.htype || "all";
  document.querySelectorAll(".card.hook").forEach(c => { c.hidden = (q && !c.dataset.text.includes(q)) || (ty !== "all" && c.dataset.type !== ty); });
}
document.addEventListener("input", e => {
  if (e.target.id === "hook-q") filterHooks();
  if (e.target.tagName === "TEXTAREA") growBox(e.target);
  if (DRAFT_IDS.includes(e.target.id)) store.set("sos.draft." + e.target.id, e.target.value);
  if (e.target.id === "radar-urls" || e.target.id === "home-radar-urls") countLinks();
});
document.addEventListener("click", e => {
  if (!e.target.closest("[data-save-draft]")) return;
  DRAFT_IDS.forEach(id => { const el = document.getElementById(id); if (el) store.set("sos.draft." + id, el.value); });
  showToast("Saved on this phone. Safe to switch apps.");
});
document.addEventListener("visibilitychange", () => { DRAFT_IDS.forEach(id => { const el = document.getElementById(id); if (el) store.set("sos.draft." + id, el.value); }); });
document.addEventListener("change", e => {
  if (e.target.id !== "acct-switch") return;
  ui.acct = e.target.value; store.set("sos.acct", ui.acct); ui.calPick = null; applyAccount(); lastKey = ""; render(true);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (tele) tele.close(); else if (ui.calPick) { ui.calPick = null; lastKey = ""; render(); } else if (document.querySelector(".menu")) closePick(); else if (voice) voice.close(); else if (sheet) closeSheet(); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "prompt") { e.preventDefault(); document.querySelector('[data-claude="ask"]')?.click(); }
});
/* ---------- Apple-grade Multilingual Welcome + Iris Aperture Reveal ---------- */
(function welcomeIntro() {
  const intro = $("#intro"), stage = $("#hello-stage"), langEl = $("#hello-lang"), ring = $("#iris-ring"), enterBtn = $("#enter-studio");
  if (!intro || !stage) return;
  const HELLOS = [
    ["Hello", "English", "latin"],
    ["നമസ്കാരം", "Malayalam", "ml"],
    ["مرحبا", "Arabic", ""],
    ["नमस्ते", "Hindi", ""],
    ["こんにちは", "Japanese", ""],
    ["Bonjour", "French", "latin"],
    ["வணக்கம்", "Tamil", ""],
    ["Hola", "Spanish", "latin"],
    ["안녕하세요", "Korean", ""],
  ];
  let idx = 0, timer = 0, active = false;
  function showWord(k) {
    const [word, lang, cls] = HELLOS[k % HELLOS.length];
    const prev = stage.querySelector(".hello-word.in");
    if (prev) { prev.classList.remove("in"); prev.classList.add("out"); setTimeout(() => prev.remove(), 750); }
    const el = document.createElement("h1");
    el.className = "hello-word" + (cls ? " " + cls : "");
    el.textContent = word;
    stage.append(el);
    if (langEl) langEl.textContent = lang;
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
  }
  function startIntro() {
    active = true; idx = 0; clearInterval(timer);
    intro.hidden = false; intro.classList.remove("leaving");
    ring.classList.remove("go");
    document.body.classList.remove("intro-open");
    document.body.classList.add("intro-wait");
    stage.innerHTML = "";
    showWord(0);
    if (!REDUCED) timer = setInterval(() => { if (active && !document.hidden) showWord(++idx); }, 2600);
    enterBtn?.focus({ preventScroll: true });
  }
  let fx = [];
  function enterStudio() {
    if (!active) return;
    active = false; clearInterval(timer);
    try { sessionStorage.setItem("sos.entered", "1"); } catch {}
    if (REDUCED || !document.body.animate) {
      intro.hidden = true; document.body.classList.remove("intro-wait");
      requestAnimationFrame(() => orb3d?.resize()); return;
    }
    const OUT = "cubic-bezier(.16,1,.3,1)", IN = "cubic-bezier(.5,0,.75,0)", SWELL = "cubic-bezier(.7,0,.15,1)";
    const b = (enterBtn || intro).getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2;
    const D = Math.ceil(2 * Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy))) + 8;
    const layer = cls => { const e = document.createElement("div"); e.className = cls;
      Object.assign(e.style, { width: D + "px", height: D + "px", left: cx - D / 2 + "px", top: cy - D / 2 + "px" }); document.body.append(e); return e; };
    const bloom = layer("bloom"), shock = layer("shock");
    // 1. setup: the button gives under the finger
    if (enterBtn) fx.push(enterBtn.animate([{ transform: "scale(1)" }, { transform: "scale(.94)", offset: .35 }, { transform: "scale(1)" }], { duration: 320, easing: OUT }));
    // 2. action: words lift away top-down, a thin light ring leads, the pearl bloom swells from the button
    [...intro.querySelectorAll(".intro-top, .hello-stage, .intro-sub, .intro-foot")].forEach((el, i) =>
      fx.push(el.animate([{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(-22px)" }], { duration: 420, delay: 40 + i * 45, easing: IN, fill: "forwards" })));
    shock.animate([{ transform: "scale(.02)", opacity: 0 }, { opacity: 1, offset: .15 }, { transform: "scale(1.02)", opacity: 0 }], { duration: 1050, delay: 90, easing: OUT, fill: "forwards" });
    const grow = bloom.animate([{ transform: "scale(.02)" }, { transform: "scale(1)" }], { duration: 900, delay: 160, easing: SWELL, fill: "forwards" });
    // 3. resolution: the screen is pure light; swap to the studio underneath, the light dissolves outward, sections rise in turn
    grow.finished.then(() => {
      intro.hidden = true;
      document.body.classList.remove("intro-wait"); document.body.classList.add("intro-open");
      orb3d?.resize();
      const fade = bloom.animate([{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(1.18)" }], { duration: 700, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" });
      fade.finished.then(() => { bloom.remove(); shock.remove(); fx.forEach(a => a.cancel()); fx = []; });
      setTimeout(() => document.body.classList.remove("intro-open"), 1150);
    });
  }
  enterBtn?.addEventListener("click", enterStudio);
  document.addEventListener("click", e => { if (e.target.closest("#replay-intro")) startIntro(); });
  document.addEventListener("keydown", e => { if (active && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); enterStudio(); } });
  let seen = false; try { seen = sessionStorage.getItem("sos.entered") === "1"; } catch {}
  if (seen) intro.hidden = true; else startIntro();
})();

render();
connect();
</script>
