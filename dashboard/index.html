<title>Social OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&display=swap">
<style>
/* Light only, by choice. Layout: gallery calm. One iridescent orb behind a one-line heading, a thin pipeline thread,
   then a horizontal rail of live channel cards. Little type, lots of air; the orb is the spectacle. */
:root {
  --bg: #eceef5; --wash-1: #dcd6ff; --wash-2: #ffdccb; --wash-3: #cdeee4;
  --surface: #ffffff; --surface-2: #f6f6fa; --line: rgba(18, 20, 40, .08); --line-2: rgba(18, 20, 40, .16);
  --fg: rgba(14, 16, 30, .88); --muted: #6c7088; --dim: #a3a6b8;
  --ink: #111222; --ink-fg: #ffffff; --accent: #5b4cf5;
  --ok: #1a9a5f; --warn: #b86e00; --bad: #d23d4b;
  --claude: #d97757; --claude-bg: #faf9f5; --claude-fg: #3d3929; --claude-line: rgba(61, 57, 41, .14);
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, Consolas, monospace;
  --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
}

* { box-sizing: border-box; }
html { overflow-x: clip; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--font-body); overflow-x: clip; }
body::after { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background: radial-gradient(40% 50% at 12% 8%, var(--wash-1), transparent 70%), radial-gradient(35% 45% at 92% 20%, var(--wash-2), transparent 70%), radial-gradient(45% 45% at 60% 100%, var(--wash-3), transparent 70%); }
#threads { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
::selection { background: var(--accent); color: #fff; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.logo { width: 16px; height: 16px; flex: none; display: block; }

/* header */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; backdrop-filter: blur(18px) saturate(1.4); background: color-mix(in srgb, var(--bg) 70%, transparent); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 9px; font: 500 15px var(--font-body); letter-spacing: -.01em; white-space: nowrap; }
.brand i { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(from 200deg, #ffb59a, #c8b8ff, #9fe3d0, #ffb59a); box-shadow: inset 0 0 0 1px rgba(255,255,255,.5); }
nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
nav button { flex: none; border: 0; background: none; color: var(--muted); font: 400 14px var(--font-body); padding: 6px 12px; border-radius: 99px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
nav button:hover { color: var(--fg); }
nav button[aria-selected="true"] { color: var(--fg); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
nav .n { font: 500 10px var(--font-mono); background: var(--ink); color: var(--ink-fg); border-radius: 99px; padding: 1px 6px; }
.mode { flex: none; display: flex; background: var(--surface-2); border-radius: 99px; padding: 3px; box-shadow: inset 0 0 0 1px var(--line); }
.mode button { border: 0; background: none; color: var(--muted); font: 400 12px var(--font-mono); padding: 4px 10px; border-radius: 99px; cursor: pointer; }
.mode button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
@media (max-width: 720px) { .bar { flex-wrap: wrap; } nav { order: 3; flex-basis: 100%; } .brand { flex: 1; } }

main { padding-block: 8px 72px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }

/* hero */
.hero { position: relative; }
.orb { position: absolute; inset: -12px -16px 96px; z-index: 0; pointer-events: none; }
.orb canvas { width: 100%; height: 100%; display: block; }
@media (max-width: 860px) { .panel-hero { align-content: end; } .orb { inset: -8px -16px auto; height: 40%; } }
@media (max-width: 640px) { .panel-hero .thread { display: none; } .panel-hero .hero-in { gap: 16px; min-height: 0; } .hero-in .figures { display: grid; grid-template-columns: repeat(4, auto); gap: 14px; } .hero-in .figures b { font-size: 22px; } }
.hero-in { position: relative; z-index: 1; display: grid; gap: 22px; justify-items: start; max-width: 640px; }
.kicker { font: 400 12px var(--font-mono); color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); color: var(--ok); animation: ping 2s infinite; }
.demo-chip { border: 1px solid var(--line-2); border-radius: 99px; padding: 1px 9px; }
.hero h1 { margin: 0; font: 400 clamp(46px, 7.4vw, 96px)/.98 var(--font-body); letter-spacing: -.045em; text-wrap: balance; }
.hero h1 em { font: 300 italic 1em var(--font-serif); letter-spacing: -.03em; }
.talk-btn { display: inline-flex; align-items: center; gap: 10px; border: 0; cursor: pointer; background: var(--ink); color: var(--ink-fg); font: 500 15px var(--font-body); padding: 13px 20px 13px 16px; border-radius: 99px; box-shadow: 0 10px 30px -10px rgba(20, 16, 60, .45); transition: transform .2s; }
.talk-btn:hover { transform: translateY(-1px); }
.talk-btn svg { width: 20px; height: 20px; color: var(--claude); }
.figures { display: flex; gap: 22px; flex-wrap: wrap; font: 400 12px var(--font-mono); color: var(--muted); }
.figures b { display: block; font: 400 26px/1.1 var(--font-body); letter-spacing: -.03em; color: var(--fg); font-variant-numeric: tabular-nums; }
.figures .warn b { color: var(--warn); } .figures .bad b { color: var(--bad); }

/* claude panel */
.claude { width: min(680px, 100%); display: grid; gap: 16px; animation: rise .45s cubic-bezier(.2, .8, .2, 1); }
.claude-hi { display: flex; align-items: center; gap: 12px; font: 300 clamp(30px, 4.4vw, 42px)/1.15 var(--font-serif); letter-spacing: -.01em; }
.claude-hi svg { width: 34px; height: 34px; color: var(--claude); flex: none; }
.pbox { background: var(--claude-bg); border: 1px solid var(--claude-line); border-radius: 20px; padding: 14px 14px 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px -18px rgba(60, 40, 20, .3); display: grid; gap: 8px; }
.pbox textarea { border: 0; outline: 0; background: transparent; resize: none; min-height: 56px; max-height: 220px; font: 400 16px/1.5 var(--font-body); color: var(--claude-fg); width: 100%; padding: 4px 6px; }
.pbox textarea::placeholder { color: color-mix(in srgb, var(--claude-fg) 45%, transparent); }
.ptools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ptools select { appearance: none; border: 1px solid var(--claude-line); background: transparent; color: var(--claude-fg); font: 400 13px var(--font-body); padding: 6px 10px; border-radius: 10px; cursor: pointer; }
.ptools .sp { flex: 1; }
.ibtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--claude-line); background: transparent; color: var(--claude-fg); display: grid; place-items: center; cursor: pointer; }
.ibtn svg { width: 17px; height: 17px; }
.ibtn.send { background: var(--claude); border-color: var(--claude); color: #fff; }
.ibtn:disabled { opacity: .45; cursor: not-allowed; }
.ibtn.on { color: var(--claude); border-color: var(--claude); box-shadow: 0 0 0 3px color-mix(in srgb, var(--claude) 18%, transparent); }
@property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.ibtn.vmode { width: 38px; height: 38px; border-radius: 50%; border: 0; color: #fff; position: relative; isolation: isolate;
  background: conic-gradient(from var(--spin), #7aa8ff, #c58bff, #ff9ac2, #8ff0d8, #7aa8ff); animation: vspin 5s linear infinite;
  box-shadow: 0 4px 14px -4px rgba(140, 110, 255, .55), inset 0 0 0 1px rgba(255, 255, 255, .35); transition: transform .2s; }
.ibtn.vmode::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), transparent 60%); z-index: -1; }
.ibtn.vmode:hover { transform: scale(1.06); }
.ibtn.vmode svg { width: 18px; height: 18px; }
.ibtn.vmode rect { transform-box: fill-box; transform-origin: center; animation: bars 1.1s ease-in-out infinite; }
.ibtn.vmode rect:nth-child(2) { animation-delay: .15s; } .ibtn.vmode rect:nth-child(3) { animation-delay: .3s; } .ibtn.vmode rect:nth-child(4) { animation-delay: .45s; }
@keyframes vspin { to { --spin: 360deg; } }
@keyframes bars { 50% { transform: scaleY(.45); } }
.txtbtn { border: 0; background: none; color: var(--muted); font: 400 13px var(--font-body); cursor: pointer; padding: 6px 8px; border-radius: 8px; }
.txtbtn:hover { color: var(--fg); background: var(--surface-2); }
.answer { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; display: grid; gap: 8px; }
.answer .by { display: flex; gap: 8px; align-items: center; font: 400 11px var(--font-mono); color: var(--muted); }
.answer .by svg { width: 14px; height: 14px; color: var(--claude); }
.thinking { display: inline-flex; gap: 4px; } .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--claude); animation: bob 1s infinite; } .thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
.inbox { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.inbox div { display: flex; gap: 8px; min-width: 0; } .inbox span:last-child { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* overlays: voice + sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(24px); animation: fade .3s; padding: 16px; }
.voice { position: fixed; inset: 0; z-index: 80; background: var(--claude-bg); color: var(--claude-fg); display: grid; grid-template-rows: auto 1fr auto; animation: fade .35s;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.voice-top { display: flex; justify-content: center; align-items: center; gap: 8px; font: 400 13px var(--font-body); color: color-mix(in srgb, var(--claude-fg) 60%, transparent); }
.voice-top svg { width: 16px; height: 16px; color: var(--claude); }
.voice-mid { display: grid; place-items: center; align-content: center; gap: clamp(8px, 2.4vh, 22px); text-align: center; min-height: 0; overflow: hidden; padding-block: 8px; }
.voice canvas { width: min(280px, 64vw, 34vh); height: min(280px, 64vw, 34vh); flex: none; }
.voice p { margin: 0; font: 300 clamp(18px, 3vh, 24px)/1.4 var(--font-serif); max-width: 30ch; min-height: 1.4em; max-height: 5.6em; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.voice small { font: 400 13px var(--font-body); color: color-mix(in srgb, var(--claude-fg) 55%, transparent); max-width: 36ch; }
.voice textarea { position: absolute; left: 50%; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; resize: none; caret-color: transparent; }
.voice-mid { position: relative; cursor: text; }
.voice-top { position: relative; z-index: 2; }
.voice-top .pickwrap { position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
.voice-top .menu { left: auto; right: 0; max-height: 50vh; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
html.locked, html.locked body { overflow: hidden; }
.voice .hint { display: inline-flex; gap: 6px; align-items: center; font: 400 13px var(--font-body); color: color-mix(in srgb, var(--claude-fg) 60%, transparent); }
.voice kbd { font: 500 12px var(--font-mono); border: 1px solid var(--claude-line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; background: var(--surface); color: var(--claude-fg); }
.voice .hint[hidden] { display: none; }
.vbtn .ic-max, .voice.mini .vbtn .ic-min { display: none; } .voice.mini .vbtn .ic-max { display: block; }
.voice.mini { inset: auto max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) auto; width: min(340px, calc(100vw - 32px));
  grid-template-rows: none; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 10px 8px 8px; border-radius: 22px;
  border: 1px solid var(--claude-line); box-shadow: 0 18px 50px -16px rgba(30, 20, 60, .35); animation: rise .25s ease-out; }
.voice.mini .voice-top, .voice.mini .hint, .voice.mini .did { display: none; }
.voice.mini .voice-mid { display: flex; gap: 10px; align-items: center; justify-content: flex-start; padding: 0; text-align: left; }
.voice.mini canvas { width: 52px; height: 52px; }
.voice.mini p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 14px; min-height: 0; max-height: 2.8em; max-width: none; }
.voice.mini p:empty::before { content: "Listening…"; color: color-mix(in srgb, var(--claude-fg) 55%, transparent); }
.voice.mini .voice-bot { padding: 0; gap: 6px; }
.voice.mini .vbtn { width: 36px; height: 36px; } .voice.mini .vbtn svg { width: 16px; height: 16px; }
.voice .did { font: 400 12px var(--font-mono); color: var(--claude); min-height: 1.4em; }
.voice-bot { display: flex; justify-content: center; gap: 22px; padding-top: 12px; }
.vbtn { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--claude-line); background: color-mix(in srgb, var(--claude-fg) 5%, transparent); color: var(--claude-fg); display: grid; place-items: center; cursor: pointer; }
.vbtn svg { width: 22px; height: 22px; }
.vbtn.send { background: var(--claude); border-color: var(--claude); color: #fff; }
.pickwrap { position: relative; }
.pick { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--claude-line); background: transparent; color: var(--claude-fg); font: 400 13px var(--font-body); padding: 6px 8px 6px 10px; border-radius: 10px; cursor: pointer; }
.pick:hover, .pick[aria-expanded="true"] { background: color-mix(in srgb, var(--claude-fg) 6%, transparent); }
.pick svg { width: 14px; height: 14px; opacity: .6; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 260px; max-width: calc(100vw - 32px); background: var(--claude-bg); border: 1px solid var(--claude-line); border-radius: 14px; padding: 6px; display: grid; gap: 2px;
  box-shadow: 0 16px 48px -14px rgba(30, 20, 10, .35); animation: rise .18s ease-out; }
.menu button { display: grid; grid-template-columns: 1fr 18px; gap: 1px 12px; text-align: left; padding: 8px 10px; border: 0; border-radius: 10px; background: none; color: var(--claude-fg); cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--claude-fg) 7%, transparent); outline: 0; }
.menu b { font: 500 14px var(--font-body); grid-column: 1; } .menu small { grid-column: 1; font: 400 12px var(--font-body); color: color-mix(in srgb, var(--claude-fg) 58%, transparent); }
.menu .chk { grid-column: 2; grid-row: 1 / 3; align-self: center; color: var(--claude); width: 18px; height: 18px; }
.hscroll { position: relative; }
.hpin { position: sticky; top: var(--hdr, 60px); height: calc(100vh - var(--hdr, 60px)); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 14px; padding-block: 12px 22px; overflow: visible; }
.track { display: flex; align-items: stretch; gap: 56px; height: 100%; min-height: 0; will-change: transform; }
.panel-hero { flex: none; width: var(--pw, 100%); height: 100%; display: grid; align-content: center; gap: 40px; }
.panel-hero .hero-in { min-height: min(430px, 60vh); align-content: center; max-height: 100%; overflow-y: auto; scrollbar-width: none; }
.panel-title { flex: none; width: 210px; display: grid; align-content: center; gap: 10px; }
.panel-title p { margin: 0; color: var(--muted); font-size: 14px; }
.track .rail { align-self: center; }
.hcount { font: 400 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.hbar { height: 1px; background: var(--line-2); position: relative; } .hbar i { position: absolute; left: 0; top: -1px; height: 3px; width: 0; background: var(--fg); border-radius: 3px; }
.sheet { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border-radius: 24px; padding: 24px; box-shadow: 0 0 0 1px var(--line), 0 40px 100px -30px rgba(20, 16, 60, .45); display: grid; gap: 18px; animation: rise .35s cubic-bezier(.2, .8, .2, 1); }
.sheet h2 { font-size: 26px; }
.plats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.plats button { border: 0; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); border-radius: 14px; padding: 14px 8px; display: grid; justify-items: center; gap: 8px; font: 400 13px var(--font-body); color: var(--fg); cursor: pointer; }
.plats button svg { width: 24px; height: 24px; }
.plats button[aria-pressed="true"] { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); }
.steps { display: grid; gap: 10px; }
.stepline { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); }
.stepline i { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1.5px var(--line-2); display: grid; place-items: center; font: 500 10px var(--font-mono); font-style: normal; }
.stepline.done { color: var(--fg); } .stepline.done i { background: var(--ok); box-shadow: none; color: #fff; }
.stepline.now { color: var(--fg); } .stepline.now i { box-shadow: inset 0 0 0 1.5px var(--accent); animation: ping 2s infinite; color: var(--accent); }

/* pipeline thread */
.thread { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); position: relative; gap: 8px; }
.thread::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 1px; background: var(--line-2); }
.st { position: relative; display: grid; gap: 4px; padding-top: 18px; min-width: 0; }
.st::before { content: ""; position: absolute; top: 0; left: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 1px var(--line-2); }
.st.on::before { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
.st b { font: 500 14px var(--font-body); } .st span { font: 400 11px var(--font-mono); color: var(--muted); }
@media (max-width: 640px) { .thread { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 18px; } .thread::before { display: none; } }

/* rail */
.rail-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
h2 { margin: 0; font: 400 28px/1.1 var(--font-body); letter-spacing: -.03em; }
.arrows { display: flex; gap: 6px; }
.arrows button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); cursor: pointer; font-size: 16px; }
.rail { display: flex; gap: 14px; padding: 6px 2px 10px; flex: none; }
.mon { --c: var(--accent); flex: none; width: 300px; height: 360px; scroll-snap-align: start; background: var(--surface); border-radius: 18px; box-shadow: 0 0 0 1px var(--line), 0 24px 48px -32px rgba(20, 20, 60, .35);
  display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; position: relative; transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s; }
.mon:hover { transform: translateY(-4px); box-shadow: 0 0 0 1px var(--line-2), 0 30px 60px -30px color-mix(in srgb, var(--c) 55%, transparent); }
.mon.big { width: 420px; }
@media (max-width: 480px) { .mon { width: 78vw; height: 360px; } .mon.big { width: 86vw; } }
.mon-top { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; min-width: 0; }
.mon-top svg.logo { color: var(--c); width: 18px; height: 18px; }
.mon-top b { font: 500 14px var(--font-body); }
.mon-top span { font: 400 12px var(--font-body); color: var(--muted); }
.mon-top .state { margin-left: auto; font: 400 11px var(--font-mono); color: var(--c); white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.mon-top .state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: ping 2s infinite; }
.mon.idle .mon-top .state { color: var(--dim); } .mon.idle .mon-top .state::before { animation: none; }
.mon-body { position: relative; min-height: 0; overflow: hidden; padding: 0 16px; }
.mon-foot { padding: 12px 16px 16px; display: grid; gap: 8px; }
.prog { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--c); transition: width .7s ease; }
.cap { font: 400 11px/1.4 var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* card contents */
.slides { display: flex; gap: 10px; height: 100%; transition: transform .8s cubic-bezier(.7, 0, .2, 1); }
.slide { flex: none; height: 100%; aspect-ratio: 4 / 5; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; color: #1a1830; }
.slide b { font: 400 30px/.98 var(--font-body); letter-spacing: -.04em; }

.reel-frame .word { position: absolute; left: 8px; right: 8px; bottom: 26%; text-align: center; font: 600 18px/1.1 var(--font-body); color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.25); }

.reel-frame .tl i { display: block; height: 100%; width: 0; background: #fff; border-radius: 3px; transition: width .9s linear; }
.reel-frame.story { background: #ffe39a; transition: background .6s; }
.reel-frame .segs { position: absolute; left: 8px; right: 8px; top: 10px; display: flex; gap: 3px; }
.segs i { flex: 1; height: 3px; border-radius: 3px; background: rgba(26,24,48,.2); overflow: hidden; } .segs i b { display: block; height: 100%; width: 0; background: #1a1830; transition: width .9s linear; }
.reel-frame.story strong { position: absolute; left: 12px; right: 12px; top: 42%; font: 400 22px/1 var(--font-body); letter-spacing: -.03em; color: #1a1830; }
.post { display: grid; gap: 10px; }
.who { display: flex; gap: 10px; align-items: center; }
.ava { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(from 120deg, #ffb59a, #c8b8ff, #9fe3d0, #ffb59a); flex: none; }
.who div { display: grid; line-height: 1.2; } .who b { font: 500 13px var(--font-body); } .who span { font: 400 11px var(--font-mono); color: var(--muted); }
.typed { font: 400 16px/1.5 var(--font-body); letter-spacing: -.01em; white-space: pre-wrap; overflow-wrap: anywhere; }

.fb-img { height: 120px; border-radius: 12px; background: linear-gradient(120deg, #c9d3ff, #8ea2ff 55%, #f6c8d8); position: relative; overflow: hidden; }
.fb-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); transform: translateX(-100%); animation: shine 2.8s ease-in-out infinite; }
.thumb { height: 140px; border-radius: 12px; background: linear-gradient(135deg, #1a1830, #4a3ca8 60%, #ff8a7a); position: relative; display: grid; place-items: center; }
.thumb::after { content: ""; width: 0; height: 0; border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 4px; }
.ab { display: grid; gap: 10px; padding-top: 12px; }
.ab-row { display: grid; gap: 5px; }

.log { font: 400 11px/1.9 var(--font-mono); color: var(--muted); display: grid; align-content: end; height: 100%; }

.log em { font-style: normal; color: var(--fg); } .log .p { color: var(--accent); }

let toastTimer;
function showToast(text) {
  const t = $("#toast"); t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3000);
}
function showOffline() { ui.offline = true; if (!mode) mode = "showcase"; lastKey = ""; render(); }
const ERR_WORDS = { unavailable: "the data service is not answering right now", "invalid-argument": "the page sent something the database refused" };
function showError(name, err) { lastKey = ""; ui.errors[name] = ERR_WORDS[err?.code] || `error "${err?.code || "unknown"}"`; render(); }

/* ---------- data ---------- */
let db = null;
async function connect() {
  db = window.claude ? await claude.use("db") : null;
  if (!db) return showOffline();
  const timer = setTimeout(() => { if (!ui.loaded) showToast("Still loading your data…"); }, 10000);
  let pending = 5;
  for (const name of ["accounts", "posts", "messages", "ideas", "schedules"]) {
    let first = true;
    db.collection(name).onSnapshot(
      snap => {
        state[name] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (first) { first = false; if (--pending === 0) { ui.loaded = true; clearTimeout(timer); if (!mode) { mode = state.posts.length ? "live" : "showcase"; lastKey = ""; } } }
        if (name === "accounts" && tab === "accounts") lastKey = "";
        render(true);
      },
      err => { clearTimeout(timer); showError(name, err); });
  }
}

async function setStatus(post, to) {
  if (!canMove(post.status, to)) return showToast(`Can't move ${post.status} to ${to}`);
  const patch = { status: to, updatedAt: nowIso() };
  if (to === "approved") Object.assign(patch, { approvedBy: "dashboard", approvedAt: nowIso() });
  try { await db.doc(`posts/${post.id}`).update(patch); showToast(to === "approved" ? "Approved" : to === "draft" ? "Sent back to draft" : "Rejected"); }
  catch (e) { showToast(`Couldn't save: ${e.code || "error"}. Try again.`); }
}

async function sendMessage(text) {
  if (!text.trim()) return false;
  await db.collection("messages").add({ from: "user", text, status: "new", reply: null, createdAt: nowIso() });
  return true;
}

async function saveIdea(text, accountId) {
  if (!text.trim()) return false;
  await db.collection("ideas").add({ text, accountId: accountId || null, source: "user", status: "new", createdAt: nowIso() });
  return true;
}

// The page records the request; Claude's next run does the setup (private folder, voice file, Composio connection)
// and moves the account from "setup" to "active".
async function addAccount(a) {
  const base = (a.platform + "-" + a.label).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || a.platform;
  let id = base, n = 2; while (state.accounts.some(x => x.id === id)) id = `${base}-${n++}`;
  await db.doc(`accounts/${id}`).set({ platform: a.platform, label: a.label, niche: a.niche, language: a.language, postsPerWeek: a.postsPerWeek,
    composioAccountId: null, status: "setup", updatedAt: nowIso() });
  await db.collection("messages").add({ from: "user", text: `Set up the new account "${a.label}" (${PLATFORMS[a.platform]}, id ${id}).`, status: "new", reply: null, createdAt: nowIso() });
}

async function quickAnswer(text, modelKey, effort, onText, agent) {
  const sample = window.claude ? await claude.use("sample") : null;
  if (!sample) { showToast("Quick answers are off for this page."); return null; }
  const m = MODELS[modelKey] || MODELS.sonnet;
  const opts = { cache: false, model: m.model, modelTier: m.modelTier, effort, ...(onText ? { onText } : {}) };
  let input = [{ role: "user", content: "You help a social media creator. Answer briefly and concretely.\n\n" + text }];
  if (agent) {
    const caps = await sample.limits().catch(() => null);
    if (caps?.tools && db) opts.tools = agentTools(agent.did);
    const waiting = state.posts.filter(p => p.status === "waiting").slice(0, 5).map(p => `${PLATFORMS[p.platform] || p.platform}: ${(p.title || p.caption || "").slice(0, 60)}`);
    const brief = `You are the voice of Social OS, the user's content system. You are speaking out loud: answer in one to three short, warm, natural sentences. No markdown, no lists, no emoji.
Right now: ${state.accounts.length} accounts, ${waiting.length} posts waiting for approval${waiting.length ? " (" + waiting.join("; ") + ")" : ""}, ${state.posts.filter(p => p.status === "approved").length} scheduled, ${state.posts.filter(p => p.status === "failed").length} failed.
${opts.tools ? "You can save ideas and leave notes for Claude's next work session with your tools; say briefly what you did." : ""}
You can never approve, publish or delete posts; if asked, tell them to tap Approve in the dashboard.`;
    input = [{ role: "user", content: brief + "\n\nUser: " + agent.history[0].content }, ...agent.history.slice(1)];
  }
  const out = await sample(input, opts);
  return { text: out.text, answeredBy: out.modelApplied ? m.label : "the fallback model" };
}

function agentTools(did) {
  return [
    { name: "save_idea", description: "Save a content idea to the Ideas list so Claude turns it into a draft later.",
      inputSchema: { type: "object", properties: { text: { type: "string", description: "The idea, in the user's words" } }, required: ["text"] },
      async execute(input) { const text = String(input?.text || "").slice(0, 1000); if (!text.trim()) throw new Error("empty idea"); await saveIdea(text, null); did("Idea saved"); return "saved"; } },
    { name: "leave_note_for_claude", description: "Leave a note or task for Claude's next work session (it reads the inbox when it runs).",
      inputSchema: { type: "object", properties: { text: { type: "string" } }, required: ["text"] },
      async execute(input) { const text = String(input?.text || "").slice(0, 2000); if (!text.trim()) throw new Error("empty note"); await sendMessage(text); did("Note left for Claude"); return "saved"; } },
  ];
}

function laneShell(l) {
  return `<article class="mon ${l.size || ""}" data-lane="${l.id}" style="--c:${l.color}">
    <div class="mon-top">${svg(l.platform || "claude")}<b>${l.platform ? PLATFORMS[l.platform] : "Claude"}</b><span>${l.kind}</span><span class="state" data-st>…</span></div>
    <div class="mon-body" data-body></div>
    <div class="mon-foot"><div class="prog"><i data-prog></i></div><div class="cap" data-cap></div></div>
  </article>`;
}
const parts = el => ({ body: el.querySelector("[data-body]"), st: el.querySelector("[data-st]"), prog: el.querySelector("[data-prog]"), cap: el.querySelector("[data-cap]") });

function realPostFor(l) {
  const order = { posting: 0, approved: 1, waiting: 2, draft: 3, failed: 4 };
  return state.posts.filter(p => p.platform === l.platform && (!l.fmt || l.fmt.includes(p.format)) && p.status in order)
    .sort((a, b) => order[a.status] - order[b.status] || byTime(a, b))[0] || null;
}
const LIVE_STATE = { posting: ["Posting", 90], approved: ["Scheduled", 75], waiting: ["Needs you", 55], draft: ["Drafting", 30], failed: ["Failed", 100] };

function paintLive(el, l) {
  const { body, st, prog, cap } = parts(el);
  if (l.id === "log") {
    const lines = state.posts.slice().sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0, 8).reverse()
      .map(p => `<div><span class="p">${esc(PLATFORMS[p.platform] || p.platform)}</span> <em>${esc(p.status)}</em> · ${esc((p.title || p.caption || "").slice(0, 50))}</div>`);
    body.innerHTML = `<div class="log">${lines.join("") || `<div>No activity yet.</div>`}</div>`;
    st.textContent = lines.length ? "Live" : "Idle"; prog.style.width = lines.length ? "100%" : "0";
    cap.textContent = `${state.posts.length} posts in the system`; el.classList.toggle("idle", !lines.length); return;
  }
  const p = realPostFor(l);
  el.classList.toggle("idle", !p);
  if (!p) {
    st.textContent = "Idle"; prog.style.width = "0";
    body.innerHTML = `<div class="idle-note">${svg(l.platform)}Nothing in this lane yet</div>`;
    cap.textContent = state.accounts.length ? "Claude adds work here" : "Add an account to start"; return;
  }
  const [label, pct] = LIVE_STATE[p.status];
  st.textContent = label; prog.style.width = pct + "%";
  const m = (p.mediaUrls || [])[0];
  body.innerHTML = m && !/\.(mp4|mov|webm)/i.test(m)
    ? `<div class="post"><img src="${esc(m)}" alt="" style="width:100%;height:150px;object-fit:cover;border-radius:12px"><div class="live-cap" style="-webkit-line-clamp:4">${esc(p.title || p.caption)}</div></div>`
    : `<div class="live-cap">${esc(p.title || p.caption)}</div>`;
  cap.textContent = `${accountLabel(p.accountId)} · ${fmtTime(p.plannedAt)}`;
}

const timers = [];
function every(ms, fn) { fn(); if (!REDUCED) timers.push(setInterval(() => { if (!document.hidden) fn(); }, ms)); }
function later(ms, fn) { timers.push(setTimeout(fn, ms)); }
function stopLoops() { while (timers.length) { const t = timers.pop(); clearInterval(t); clearTimeout(t); } }
function typer(node, text, speed, done) {
  let i = 0; node.textContent = "";
  if (REDUCED) { node.textContent = text; done && done(); return; }
  const t = setInterval(() => { if (document.hidden) return; i += 1 + (Math.random() < .3 ? 1 : 0); node.textContent = text.slice(0, i); if (i >= text.length) { clearInterval(t); done && done(); } }, speed);
  timers.push(t);
}
let logK = 0;
function pushLog() {
  const box = document.querySelector('[data-lane="log"] .log'); if (!box) return;
  const [stage, what] = LOG_LINES[logK++ % LOG_LINES.length];
  box.insertAdjacentHTML("beforeend", `<div>${clock()} <span class="p">${stage}</span> <em>${what}</em></div>`);
  while (box.children.length > 9) box.firstElementChild.remove();
  document.querySelectorAll(".st").forEach((s, i) => s.classList.toggle("on", STAGES[i] === stage));
}
const who = handle => `<div class="who"><span class="ava"></span><div><b>Your brand</b><span>${handle}</span></div></div>`;

function playShowcase(el, l) {
  const { body, st, prog, cap } = parts(el);
  el.classList.remove("idle");
  switch (l.id) {
    case "carousel": {
      body.innerHTML = `<div class="slides">${DEMO.carousel.map(([bg, h, s]) => `<div class="slide" style="background:${bg}"><small>${s}</small><b>${h}</b></div>`).join("")}</div>`;
      let i = 0; const strip = body.querySelector(".slides");
      every(2200, () => { const w = strip.firstElementChild.getBoundingClientRect().width + 10; strip.style.transform = `translateX(${-i * w}px)`;
        st.textContent = `Slide ${i + 1}/5`; prog.style.width = ((i + 1) * 20) + "%"; cap.textContent = "Laying out in brand colours"; i = (i + 1) % 5; });
      break;
    }
    case "reel": {
      body.innerHTML = `<div class="reel-frame"><div class="word"></div><div class="tl"><i></i></div></div>`;
      let t = 0; const word = body.querySelector(".word"), tl = body.querySelector(".tl i");
      every(900, () => { const w = DEMO.reel, k = t % w.length; word.innerHTML = (k ? w[k - 1] + " " : "") + `<mark>${w[k]}</mark>`;
        const pct = (t % 28) / 28 * 100; tl.style.width = pct + "%";
        st.textContent = `Editing 0:${String(t % 28).padStart(2, "0")}`; prog.style.width = pct + "%"; cap.textContent = "Captions synced to the beat"; t++; });
      break;
    }
    case "story": {
      body.innerHTML = `<div class="reel-frame story"><div class="segs">${DEMO.story.map(() => "<i><b></b></i>").join("")}</div><strong></strong></div>`;
      let i = 0; const fr = body.querySelector(".reel-frame"), segs = body.querySelectorAll(".segs b");
      every(1800, () => { const k = i % 3; if (k === 0) segs.forEach(s => s.style.width = "0");
        segs[k].style.width = "100%"; fr.style.background = DEMO.story[k][0]; fr.querySelector("strong").textContent = DEMO.story[k][1];
        st.textContent = `Frame ${k + 1}/3`; prog.style.width = ((k + 1) / 3 * 100) + "%"; cap.textContent = "One image per frame · checked"; i++; });
      break;
    }
    case "x": case "linkedin": case "threads": case "facebook": {
      const names = { x: "@yourbrand · 1/4", linkedin: "Founder · 2nd", threads: "@yourbrand", facebook: "Page · Public" };
      body.innerHTML = `<div class="post">${who(names[l.id])}${l.id === "facebook" ? `<div class="fb-img"></div>` : ""}<div class="typed" data-t></div></div>`;
      const node = body.querySelector("[data-t]");
      const steps = { x: ["Writing", "Checking 280", "Ready"], linkedin: ["Writing", "Humanizing", "Needs you"], threads: ["Writing", "Tone check", "Ready"], facebook: ["Writing", "Image set", "7:00 PM"] }[l.id];
      const run = () => { st.textContent = steps[0]; prog.style.width = "20%"; cap.textContent = "In the account's own voice";
        typer(node, DEMO[l.id], l.id === "x" ? 30 : 42, () => { st.textContent = steps[1]; prog.style.width = "70%";
          later(1400, () => { st.textContent = steps[2]; prog.style.width = "100%"; later(2600, run); }); }); };
      run();
      break;
    }
    case "youtube": {
      body.innerHTML = `<div class="thumb"></div><div class="ab">${DEMO.youtube.map((t, i) => `<div class="ab-row"><div>${"AB"[i]} · ${t}<span data-v="${i}">0%</span></div><div class="prog"><i data-ab="${i}" style="background:${i ? "var(--accent)" : "#ff0033"}"></i></div></div>`).join("")}</div>`;
      every(1500, () => { const a = 40 + Math.round(Math.random() * 25), v = [a, 100 - a];
        v.forEach((x, i) => { body.querySelector(`[data-ab="${i}"]`).style.width = x + "%"; body.querySelector(`[data-v="${i}"]`).textContent = x + "%"; });
        st.textContent = "Testing titles"; prog.style.width = "60%"; cap.textContent = "Predicted click share"; });
      break;
    }
    case "log": {
      body.innerHTML = `<div class="log"></div>`;
      st.textContent = "Running"; prog.style.width = "100%"; cap.textContent = "Every step, as it happens";
      for (let n = 0; n < 6; n++) pushLog();
      every(1700, pushLog);
      break;
    }
  }
}

function paintRail(fresh) {

    const l = LANES.find(x => x.id === el.dataset.lane);
    if (mode === "showcase") { if (fresh) playShowcase(el, l); } else paintLive(el, l);

/* ---------- 3D orb ---------- */
let orb3d = null;
function startOrb() {
  const host = document.querySelector(".orb"); if (!host || !window.THREE) return;
  if (orb3d) { host.append(orb3d.canvas); orb3d.resize(); if (!orb3d.running) orb3d.go(); return; }
  const THREE = window.THREE;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(36, 1, .1, 100); cam.position.set(0, 0, 8);
  const isDark = () => false;
  const uni = { t: { value: 0 }, dark: { value: isDark() ? 1 : 0 } };
  const mat = new THREE.ShaderMaterial({ uniforms: uni, transparent: true,
    vertexShader: `uniform float t; varying vec3 vN; varying vec3 vP;
      void main(){ vec3 p = position; float d = sin(p.x*2.2+t*.9)*sin(p.y*2.6+t*1.1)*sin(p.z*2.0+t*.7);
        p += normal * d * .09; vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(p,1.); vP = -mv.xyz; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform float t; uniform float dark; varying vec3 vN; varying vec3 vP;
      void main(){ vec3 n = normalize(vN); vec3 v = normalize(vP); float f = pow(1. - max(dot(n,v),0.), 2.2);
        vec3 peach = vec3(1.,.72,.6), lilac = vec3(.76,.7,1.), mint = vec3(.62,.9,.82), deep = vec3(.36,.3,.96);
        float a = .5 + .5*sin(n.y*2.4 + t*.5), b = .5 + .5*sin(n.x*2.0 - t*.4);
        vec3 c = mix(mix(peach, lilac, a), mix(mint, deep, .35), b*.55);
        vec3 L = normalize(vec3(-.55, .7, .6)); float diff = max(dot(n, L), 0.);
        float spec = pow(max(dot(reflect(-L, n), v), 0.), 28.);
        c *= .72 + .38 * diff; c += spec * .55; c = mix(c, vec3(1.), f * .7); c *= mix(1., .85, dark);
        gl_FragColor = vec4(c, .96); }` });
  const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(1.7, 40), mat);
  const group = new THREE.Group(); group.add(ball); scene.add(group);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.45, .004, 6, 200), new THREE.MeshBasicMaterial({ color: 0x8a80ff, transparent: true, opacity: .35 }));
  ring.rotation.x = 1.25; group.add(ring);
  // the real platform logos orbit the orb
  const sprites = ["instagram", "linkedin", "x", "youtube", "facebook", "threads"].map((name, i) => {

  });

  const canvas = renderer.domElement;

/* ---------- voice mode ---------- */
// Artifact pages get no microphone, so speech arrives through the OS dictation (Win+H) or the phone keyboard mic,
// typed into a hidden box. The blob reacts to each word, a 2 s pause sends it, and the reply is spoken with a
// browser voice the user picks. As an agent it can save ideas and leave notes; it can never approve or publish.
let voice = null;
const isTouch = matchMedia("(pointer: coarse)").matches;
function voiceList() {
  const all = ("speechSynthesis" in window ? speechSynthesis.getVoices() : []).filter(v => /^en/i.test(v.lang));
  const female = /female|neerja|aria|jenny|sonia|libby|emma|ava|michelle|natasha|clara|samantha|zira|heera|karen|moira|tessa|serena|veena|susan|hazel/i;
  const score = v => (female.test(v.name) ? 10 : 0) + (/natural|neural/i.test(v.name) ? 3 : 0) + (/neerja/i.test(v.name) ? 2 : 0) + (/google/i.test(v.name) ? 2 : 0) + (/en-(in|gb|us)/i.test(v.lang) ? 1 : 0);
  return all.sort((x, y) => score(y) - score(x)).slice(0, 12);
}
function pickedVoice() { const vs = voiceList(), want = store.get("sos.voice", ""); return vs.find(v => v.name === want) || vs[0] || null; }
function refreshVoicePicks() {
  PICKS.voice = { key: "sos.voice", def: pickedVoice()?.name || "", items: Object.fromEntries(voiceList().map(v => [v.name, [v.name.replace(/^Microsoft |^Google /, "").replace(/ Online \(Natural\)/, " · natural").split(" - ")[0], v.lang]])) };
  const b = document.querySelector('[data-pick="voice"]'); if (b) b.firstChild.textContent = (pickedVoice()?.name || "Voice").replace(/^Microsoft |^Google /, "").replace(/ Online \(Natural\).*/, "").split(" - ")[0];
}
if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = refreshVoicePicks; refreshVoicePicks(); }

function openVoice() {
  refreshVoicePicks();
  const el = document.createElement("div"); el.className = "voice";
  el.innerHTML = `<div class="voice-top">${svg("claude")}${(MODELS[store.get("sos.model", "sonnet")] || MODELS.sonnet).label} · voice
      ${PICKS.voice && Object.keys(PICKS.voice.items).length ? `<div class="pickwrap"><button class="pick" data-pick="voice" aria-haspopup="menu" aria-expanded="false">Voice${CHEV}</button></div>` : ""}</div>
    <div class="voice-mid"><canvas width="560" height="560"></canvas><p data-say></p><span class="did" data-did></span>
      <span class="hint" data-hint>${isTouch ? "Tap the mic on your keyboard and speak" : "Press <kbd>Win</kbd> + <kbd>H</kbd> and speak"}</span>
      <textarea id="voice-text" rows="1" aria-label="What you said" autocomplete="off"></textarea></div>
    <div class="voice-bot"><button class="vbtn" data-voice="mini" aria-label="Minimise" title="Minimise"><svg class="ic-min" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg><svg class="ic-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button><button class="vbtn" data-voice="end" aria-label="End voice">${XICON}</button></div>`;
  document.body.append(el); document.documentElement.classList.add("locked");
  refreshVoicePicks();
  const cv = el.querySelector("canvas"), g = cv.getContext("2d"), say = el.querySelector("[data-say]"), hint = el.querySelector("[data-hint]"), didEl = el.querySelector("[data-did]"), ta = el.querySelector("#voice-text");
  let level = .15, target = .15, phase = "listen", raf = 0, rec = null, finalText = "", pause = 0;
  const history = [];
  const W = 560, C = W / 2;
  const draw = now => {
    const t = now / 1000;
    target = phase === "think" ? .25 + Math.sin(t * 3) * .12 : phase === "speak" ? Math.max(target * .95, .28) : Math.max(target * .965, .12);
    level += (target - level) * .14;
    g.clearRect(0, 0, W, W);
    const base = 150 + level * 26;
    for (const [col, ph, sc] of [["#7aa8ff", 0, 1], ["#c58bff", 2.1, .95], ["#ff9ac2", 4.2, .9], ["#8ff0d8", 1.1, .85]]) {
      g.beginPath();
      for (let a = 0; a <= Math.PI * 2 + .01; a += .04) {
        const r = (base + Math.sin(a * 3 + t * (1.4 + level) + ph) * (6 + level * 30) + Math.sin(a * 5 - t * (1.9 + level) + ph) * (3 + level * 16)) * sc;
        a === 0 ? g.moveTo(C + Math.cos(a) * r, C + Math.sin(a) * r) : g.lineTo(C + Math.cos(a) * r, C + Math.sin(a) * r);
      }
      g.closePath();
      const gr = g.createRadialGradient(C - 40 + Math.cos(t * .7 + ph) * 30, C - 50 + Math.sin(t * .7 + ph) * 30, 10, C, C, base * 1.2);
      gr.addColorStop(0, "#ffffff"); gr.addColorStop(.45, col); gr.addColorStop(1, col + "00");

    }

  };
  draw(0);
  const bump = k => { target = Math.min(1, target + k); };
  const focusBox = () => { if (phase === "listen") ta.focus({ preventScroll: true }); };
  const listen = () => { phase = "listen"; say.textContent = ""; hint.hidden = false; ta.value = ""; finalText = ""; focusBox(); };
  el.querySelector(".voice-mid").addEventListener("click", focusBox);
  const heard = () => { const words = ta.value.trim(); hint.hidden = !!words; say.textContent = words.slice(-140); clearTimeout(pause); if (words) pause = setTimeout(send, 2000); };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    try {
      rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || "en-IN";
      rec.onresult = e => { if (phase !== "listen") return; let interim = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) finalText += r[0].transcript + " "; else interim += r[0].transcript; }
        bump(.4); ta.value = (finalText + interim).trim(); heard(); };
      rec.onerror = () => { rec = null; };
      rec.start();
    } catch { rec = null; }
  }
  let prevLen = 0;
  ta.addEventListener("input", () => { const n = ta.value.length; bump(Math.min(.8, .2 + Math.max(0, n - prevLen) * .04)); prevLen = n; heard(); });
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  focusBox();
  const did = msg => { didEl.textContent = "✓ " + msg; };
  async function send() {
    clearTimeout(pause);
    const text = ta.value.trim(); if (!text || phase !== "listen") return;
    phase = "think"; hint.hidden = true; say.textContent = "…"; ta.value = ""; prevLen = 0; didEl.textContent = "";
    history.push({ role: "user", content: text }); if (history.length > 8) history.splice(0, history.length - 8);
    if (history[0].role !== "user") history.shift();
    try {
      const res = await quickAnswer(text, store.get("sos.model", "sonnet"), store.get("sos.effort", "low"),
        ({ text: so }) => { if (!voice) return; phase = "speak"; say.textContent = so.slice(-200); bump(.12); }, { history, did });
      if (!voice) return;
      if (!res) return listen();
      history.push({ role: "assistant", content: res.text });
      ui.answer = res; say.textContent = res.text.slice(-200);
      if ("speechSynthesis" in window) {

  }
  voice = { action(a) { if (a === "send") send(); else if (a === "mini") this.mini(); else this.close(); },
    mini() { const m = el.classList.toggle("mini"); document.documentElement.classList.toggle("locked", !m); const b = el.querySelector('[data-voice="mini"]'); b.setAttribute("aria-label", m ? "Full screen" : "Minimise"); b.title = m ? "Full screen" : "Minimise"; focusBox(); },
    close() { clearTimeout(pause); cancelAnimationFrame(raf); try { rec && rec.stop(); } catch {} try { speechSynthesis.cancel(); } catch {} el.remove(); voice = null; document.documentElement.classList.remove("locked"); if (ui.claudeOpen) paintHero(); } };
}

let dictating = null;

  box.focus();

  if (SR) { try { let fin = ""; rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || "en-IN";
    rec.onresult = e => { let interim = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) fin += r[0].transcript + " "; else interim += r[0].transcript; } box.value = ((start ? start + " " : "") + fin + interim).trim(); };

  const w = state.posts.filter(p => p.status === "waiting").sort(byTime);
  if (!w.length) return `<div class="empty">No drafts waiting. Claude adds them here.</div>`;
  return `<h2>${w.length} waiting for your yes</h2><div class="list">${w.map(p => {
    const probs = p.problems || [];
    const body = ["text", "thread"].includes(p.format) || !(p.mediaUrls || []).length
      ? `<div class="textpost">${p.title ? `<b>${esc(p.title)}</b>` : ""}<p class="caption">${esc(p.caption)}</p></div>`
      : `${preview(p)}${p.title ? `<b>${esc(p.title)}</b>` : ""}<p class="caption">${esc(p.caption)}</p>`;
    return `<article class="card">${postMeta(p)}${body}
      ${probs.length ? `<ul class="problems">${probs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      <div class="row">
        <button class="btn primary" data-act="approved" data-id="${esc(p.id)}" ${probs.length ? "disabled title=\"Fix the problems first\"" : ""}>Approve</button>
        <button class="btn" data-act="draft" data-id="${esc(p.id)}">Back to draft</button>
        <button class="btn danger" data-act="rejected" data-id="${esc(p.id)}">Reject</button>
      </div></article>`;
  }).join("")}</div>`;
}

function viewCalendar() {
  const days = [];
  for (let i = 0; i < 14; i++) days.push(dayKey(new Date(Date.now() + i * 864e5).toISOString()));
  const groups = Object.fromEntries(days.map(d => [d, []]));
  for (const p of state.posts) if (p.plannedAt && groups[dayKey(p.plannedAt)] && p.status !== "rejected") groups[dayKey(p.plannedAt)].push(p);
  const any = days.some(d => groups[d].length);
  const dayName = d => new Intl.DateTimeFormat("en-IN", { timeZone: TZ, weekday: "long", day: "numeric", month: "short" }).format(new Date(d + "T12:00:00+05:30"));
  return `<h2>Next 14 days</h2>
    ${any ? "" : `<div class="empty">No posts planned in the next two weeks.</div>`}
    ${days.filter(d => groups[d].length).map(d => `<section class="day"><h3>${esc(dayName(d))}<span>${groups[d].length} posts</span></h3>
      ${groups[d].sort(byTime).map(p => `<div class="calpost s-${esc(p.status)}"><div class="barc"></div><div>
        <div class="meta"><span>${esc(fmtHour(p.plannedAt))}</span>${plat(p.platform)}<span>${esc(accountLabel(p.accountId))}</span>${pill(p.status)}</div>
        <div class="clip">${esc(p.title || p.caption)}</div>
        ${MANUAL[p.platform] ? `<div class="row"><button class="btn" data-copy="${esc(p.id)}">Copy text</button><a class="btn" href="${MANUAL[p.platform]}" target="_blank" rel="noopener">Open ${esc(PLATFORMS[p.platform])}</a></div>` : ""}
      </div></div>`).join("")}</section>`).join("")}`;
}

const ACC_STATE = { setup: "Setting up", active: "Active", paused: "Paused" };
function viewAccounts() {
  return `<h2>Accounts</h2><div class="acc-grid">
    ${state.accounts.map(a => `<article class="acc">
      <div class="acc-top"><span class="mark" style="color:${BRAND[a.platform] || "currentColor"}">${ICONS[a.platform] ? svg(a.platform) : ""}</span><div><b>${esc(a.label)}</b><span>${esc(PLATFORMS[a.platform] || a.platform)}</span></div></div>
      <dl><dt>Topic</dt><dd>${esc(a.niche)}</dd><dt>Per week</dt><dd>${esc(a.postsPerWeek)} posts</dd><dt>Language</dt><dd>${esc(a.language || "English")}</dd>
        <dt>Connected</dt><dd>${a.composioAccountId ? "Yes" : "Not yet"}</dd></dl>
      <div>${pill(a.status, ACC_STATE[a.status] || a.status)}</div></article>`).join("")}
    <button class="acc add" data-add-account><span class="plus">+</span>Add account<small>Pick a platform and a topic. Claude does the rest.</small></button>
  </div>`;
}

function accountOptions(sel) {
  return `<option value="">Any account</option>` + state.accounts.map(a => `<option value="${esc(a.id)}" ${a.id === sel ? "selected" : ""}>${esc(a.label)} · ${esc(PLATFORMS[a.platform] || a.platform)}</option>`).join("");
}

function viewIdeas() {
  const ideas = [...state.ideas].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  return `<section class="card"><h2>New idea</h2>
      <div class="field"><label class="label" for="idea-text">Idea</label><textarea class="field-in" id="idea-text" placeholder="A post about…"></textarea>
      <span class="muted">Tip: tap the mic on your phone keyboard to speak.</span></div>
      <div class="field"><label class="label" for="idea-acct">For</label><select class="field-in" id="idea-acct">${accountOptions("")}</select></div>
      <div class="row"><button class="btn primary" id="idea-save">Save idea</button></div></section>
    <section class="list"><h2>Ideas</h2>
      ${ideas.length ? ideas.map(i => `<div class="card"><div class="meta"><span>${esc(i.accountId ? accountLabel(i.accountId) : "Any account")}</span><span>${esc(i.source)}</span>${pill(i.status)}</div><p class="caption">${esc(i.text)}</p></div>`).join("")
        : `<div class="empty">No ideas saved yet. Write one above and Claude turns it into a draft.</div>`}
    </section>`;
}

// The page only records what the user wants; Claude's next run creates, pauses or removes the real cloud job
// (that step needs the user's yes in chat) and marks the row "active".
const SCHED_KIND = { research: "Find trending ideas", publish: "Post approved items", results: "Check results" };
const SCHED_STATE = { requested: "Waiting for Claude", active: "Active", paused: "Paused", remove: "Removing" };
function viewSchedules() {
  const rows = [...state.schedules].sort((a, b) => String(a.time).localeCompare(String(b.time)));
  return `<section class="card"><h2>New schedule</h2>
      <div class="field"><label class="label" for="sch-acct">For</label><select class="field-in" id="sch-acct">${accountOptions("").replace("Any account", "All accounts")}</select></div>
      <div class="field"><label class="label" for="sch-kind">Job</label><select class="field-in" id="sch-kind">${Object.entries(SCHED_KIND).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></div>
      <div class="field"><label class="label" for="sch-every">How often</label><select class="field-in" id="sch-every"><option value="daily">Every day</option><option value="weekly">Every Monday</option></select></div>
      <div class="field"><label class="label" for="sch-time">Time (India)</label><input class="field-in" id="sch-time" type="time" value="08:00"></div>
      <div class="row"><button class="btn primary" id="sch-save">Add schedule</button></div>
      <span class="muted">Claude switches it on in its next chat. Finding ideas fills the Ideas tab; you still approve every post.</span></section>
    <section class="list"><h2>Schedules</h2>
      ${rows.length ? rows.map(r => `<div class="card"><div class="meta"><span>${esc(r.accountId ? accountLabel(r.accountId) : "All accounts")}</span><span>${esc(r.every === "weekly" ? "Mondays" : "Daily")} ${esc(r.time)}</span>${pill(r.status, SCHED_STATE[r.status] || r.status)}</div>
        <p class="caption">${esc(SCHED_KIND[r.kind] || r.kind)}${r.note ? ` · ${esc(r.note)}` : ""}</p>
        <div class="row">${r.status === "paused" ? `<button class="btn" data-sch="active" data-id="${esc(r.id)}">Resume</button>` : r.status === "remove" ? "" : `<button class="btn" data-sch="paused" data-id="${esc(r.id)}">Pause</button>`}
          ${r.status === "remove" ? "" : `<button class="btn danger" data-sch="remove" data-id="${esc(r.id)}">Remove</button>`}</div></div>`).join("")
        : `<div class="empty">No schedules yet. Add one above, for example "Find trending ideas, every day at 08:00".</div>`}
    </section>`;
}

const VIEWS = { wall: viewWall, approve: viewApprove, calendar: viewCalendar, accounts: viewAccounts, ideas: viewIdeas, schedules: viewSchedules };

let lastKey = "";
function render(dataChanged) {
  const waiting = state.posts.filter(p => p.status === "waiting").length;
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${l}${k === "approve" && waiting ? `<span class="n">${waiting}</span>` : ""}</button>`).join("");
  document.querySelectorAll("#mode button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === (mode || "showcase"))));
  const key = tab + "|" + mode;
  if (key === lastKey && (tab === "wall" || tab === "ideas")) {
    // keep the wall, the orb and anything being typed; refresh only what changed
    if (dataChanged && tab === "wall") { const f = document.querySelector("[data-figs]"); if (f) f.innerHTML = figuresHtml();
      document.querySelectorAll(".st span").forEach((n, i) => n.textContent = pipeCounts()[i]);
      if (mode === "live") paintRail(false); if (ui.claudeOpen && document.activeElement?.id !== "prompt") paintHero(); }
    if (dataChanged && tab === "ideas") { const keep = ["idea-text", "idea-acct"].map(id => [id, document.getElementById(id)?.value]); $("#view").innerHTML = VIEWS.ideas(); for (const [id, v] of keep) { const el = document.getElementById(id); if (el && v != null) el.value = v; } }
    return;
  }
  lastKey = key;
  let html = "";
  if (ui.offline) html += `<div class="banner">Open this page signed in to claude.ai to see your data. The control room is showing demo content.</div>`;
  for (const [name, why] of Object.entries(ui.errors)) html += `<div class="banner">Couldn't load ${esc(name)}: ${esc(why)}. Reopen the page to retry.</div>`;
  stopLoops();
  $("#view").innerHTML = html + VIEWS[tab]();
  if (tab === "wall") { paintRail(true); startOrb(); requestAnimationFrame(layoutPin); }
}
function paintHero() {
  const h = $("#hero"); if (!h) return;
  const keepText = $("#prompt")?.value;
  h.innerHTML = heroInner();
  const p = $("#prompt"); if (p) { if (keepText != null) p.value = keepText; p.focus(); }
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  if (!e.target.closest(".pickwrap")) closePick();
  const t = e.target.closest("button, a"); if (!t || t.closest(".sheet-bg")) return;
  if (t.dataset.tab) { tab = t.dataset.tab; store.set("sos.tab3", tab); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.mode) { mode = t.dataset.mode; store.set("sos.mode", mode); render(); return; }
  if (t.dataset.voice) { voice?.action(t.dataset.voice); return; }
  if (t.dataset.pick) { t.getAttribute("aria-expanded") === "true" ? closePick() : openPick(t); return; }
  if (t.dataset.choose) { const i = t.dataset.choose.indexOf(":"), k = t.dataset.choose.slice(0, i), v = t.dataset.choose.slice(i + 1); store.set(PICKS[k].key, v); closePick();
    if (k === "voice") { refreshVoicePicks(); try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance("Hi, this is how I sound."); const pv = pickedVoice(); if (pv) { u.voice = pv; u.lang = pv.lang; } speechSynthesis.speak(u); } catch {} } else paintHero(); return; }
  if ("addAccount" in t.dataset) { openAddAccount(); return; }
  const c = t.dataset.claude;
  if (c === "open") { ui.claudeOpen = true; paintHero(); return; }
  if (c === "close") { stopDictate(); ui.claudeOpen = false; paintHero(); return; }
  if (c === "voice") { stopDictate(); openVoice(); return; }
  if (c === "dictate") { dictating ? stopDictate() : startDictate(t); return; }
  if (c === "save") {
    if (!db) return showToast("Sign in to claude.ai to save.");
    try { if (await sendMessage($("#prompt").value)) { $("#prompt").value = ""; showToast("Saved. Claude answers in its next run."); } else showToast("Write something first."); }
    catch (err) { showToast(`Couldn't save: ${err.code || "error"}.`); }
    return;
  }
  if (c === "ask") {
    const text = $("#prompt").value; if (!text.trim()) return showToast("Write a question first.");
    const mk = store.get("sos.model", "sonnet"), ef = store.get("sos.effort", "medium");
    stopDictate(); ui.answering = true; ui.answer = null; paintHero();
    try { ui.answer = await quickAnswer(text, mk, ef); }
    catch (err) { ui.answer = { text: err.code === "rate_limited" ? "Too many quick answers just now. Wait a minute." : err.code === "not_granted" ? "Quick answers are switched off for this page." : (err.text || "That didn't work. Try again."), answeredBy: "nobody" }; }
    ui.answering = false; paintHero(); return;
  }
  if (!db && (t.dataset.act || t.dataset.sch || t.id === "idea-save" || t.id === "sch-save")) return showToast("Sign in to claude.ai to save.");
  if (t.dataset.act) { const p = state.posts.find(x => x.id === t.dataset.id); if (p) { t.disabled = true; await setStatus(p, t.dataset.act); } return; }
  if (t.dataset.copy) {
    const p = state.posts.find(x => x.id === t.dataset.copy); if (!p) return;
    try { await navigator.clipboard.writeText(p.caption); showToast("Copied. Paste it in the app."); }
    catch { showToast("Copy was blocked. Press and hold the text to copy it."); }
    return;
  }
  if (t.id === "sch-save") {
    const time = $("#sch-time").value; if (!time) return showToast("Pick a time first.");
    try { await db.collection("schedules").add({ accountId: $("#sch-acct").value || null, kind: $("#sch-kind").value, every: $("#sch-every").value, time, status: "requested", note: null, createdAt: nowIso(), updatedAt: nowIso() }); showToast("Schedule saved. Claude switches it on next time."); }
    catch (err) { showToast(`Couldn't save: ${err.code || "error"}.`); }
    return;
  }
  if (t.dataset.sch) {
    t.disabled = true;
    try { await db.doc(`schedules/${t.dataset.id}`).update({ status: t.dataset.sch, updatedAt: nowIso() }); showToast(t.dataset.sch === "remove" ? "Claude removes it next time." : t.dataset.sch === "paused" ? "Paused" : "Resumed"); }
    catch (err) { showToast(`Couldn't save: ${err.code || "error"}.`); }
    return;
  }
  if (t.id === "idea-save") {
    try { if (await saveIdea($("#idea-text").value, $("#idea-acct").value)) { $("#idea-text").value = ""; showToast("Idea saved"); } else showToast("Write the idea first."); }
    catch (err) { showToast(`Couldn't save: ${err.code || "error"}.`); }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (document.querySelector(".menu")) closePick(); else if (voice) voice.close(); else if (sheet) closeSheet(); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "prompt") { e.preventDefault(); document.querySelector('[data-claude="ask"]')?.click(); }
});
/* ---------- background threads: silk lines that bend with the scroll, one dot per platform rides each ---------- */
(function threads() {
  const cv = $("#threads"), g = cv.getContext("2d");
  const COLS = ["#e1306c", "#0a66c2", "#111222", "#ff0033", "#0866ff", "#5b4cf5", "#d97757"];
  let w = 0, h = 0, dpr = 1, sy = scrollY, vy = scrollY, last = 0;
  const size = () => { dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight; cv.width = w * dpr; cv.height = h * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); };
  addEventListener("resize", size); size();
  addEventListener("scroll", () => { sy = scrollY; }, { passive: true });
  const yAt = (i, x, t, s) => {
    const base = h * (.16 + i * .115), k = x / w;
    return base + Math.sin(k * 3.1 + t * .18 + i * .9 + s * .0021) * (26 + i * 5) + Math.sin(k * 7.3 - t * .11 + i * 1.7 - s * .0013) * (10 + i * 2) + Math.sin(s * .0009 + i) * 34 * k;
  };
  function frame(now) {
    const t = now / 1000;
    vy += (sy - vy) * .08;                          // eased scroll so the lines glide
    if (Math.abs(sy - vy) < .5 && now - last < 66 && !REDUCED) { requestAnimationFrame(frame); return; }   // idle: ~15 fps
    last = now;
    g.clearRect(0, 0, w, h);
    const maxS = Math.max(1, document.documentElement.scrollHeight - h), prog = Math.min(1, vy / maxS);
    for (let i = 0; i < 7; i++) {
      const grad = g.createLinearGradient(0, 0, w, 0);
      grad.addColorStop(0, "rgba(91,76,245,0)"); grad.addColorStop(.35, "rgba(91,76,245,.16)"); grad.addColorStop(.7, "rgba(217,119,87,.13)"); grad.addColorStop(1, "rgba(217,119,87,0)");
      g.strokeStyle = grad; g.lineWidth = i % 3 === 0 ? 1.2 : .8;
      g.beginPath();
      for (let x = -20; x <= w + 20; x += 14) { const y = yAt(i, x, t, vy); x === -20 ? g.moveTo(x, y) : g.lineTo(x, y); }
      g.stroke();
      // a rider per thread, carried along by the scroll
      const rx = ((prog * 1.6 + i * .137 + t * .004) % 1) * w, ry = yAt(i, rx, t, vy);
      const glow = g.createRadialGradient(rx, ry, 0, rx, ry, 14);
      glow.addColorStop(0, COLS[i] + "55"); glow.addColorStop(1, COLS[i] + "00");
      g.fillStyle = glow; g.beginPath(); g.arc(rx, ry, 14, 0, Math.PI * 2); g.fill();
      g.fillStyle = COLS[i]; g.beginPath(); g.arc(rx, ry, 2.2, 0, Math.PI * 2); g.fill();
    }
    if (!REDUCED) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (REDUCED) addEventListener("scroll", () => { vy = sy; requestAnimationFrame(frame); }, { passive: true });
})();

render();
connect();
</script>
